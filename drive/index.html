<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NEON BOXING 3D: PRO EDITION</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100vw;height:100vh;overflow:hidden;background:#000;
    font-family:system-ui,-apple-system,sans-serif;user-select:none;touch-action:none;
    position:fixed;top:0;left:0;color:#fff}
  canvas{display:block}

  /* Red Flash Overlay */
  #bloodOverlay{position:fixed;inset:0;pointer-events:none;z-index:50;
    background:radial-gradient(circle, transparent 30%, rgba(200,0,0,0.8) 100%);
    opacity:0;transition:opacity 0.15s ease-out}
  #bloodOverlay.show{opacity:1}

  /* Amaran Landscape */
  #rotateWarn{position:fixed;inset:0;z-index:9999;background:#050510;
    display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  #rotateWarn h2{color:#00ffff;margin-bottom:10px;font-size:28px;text-shadow:0 0 20px #00ffff;letter-spacing:2px}
  #rotateWarn p{opacity:0.7;font-size:14px}
  @media (orientation: portrait) { #rotateWarn{display:flex} }

  /* HUD */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  
  .stats-container{position:absolute;top:20px;width:35%;display:flex;flex-direction:column;gap:8px}
  #p1-ui{left:20px;align-items:flex-start}
  #p2-ui{right:20px;align-items:flex-end}
  
  .name{font-size:14px;font-weight:900;letter-spacing:2px;text-shadow:0 0 10px currentColor}
  
  .bar-bg{width:100%;height:16px;background:rgba(0,0,0,.7);border:2px solid #fff;
    border-radius:8px;overflow:hidden;box-shadow:0 0 10px rgba(255,255,255,0.1);position:relative}
  
  .health-fill{height:100%;width:100%;transition:width .2s ease-out}
  #p1-ui .health-fill{background:linear-gradient(90deg,#00ffff,#0088ff);box-shadow:0 0 15px #00ffff}
  #p2-ui .health-fill{background:linear-gradient(90deg,#ff0055,#ff00aa);box-shadow:0 0 15px #ff0055;margin-left:auto}
  #p2-ui .bar-bg{transform:scaleX(-1)}

  .stamina-bg{width:60%;height:8px;margin-top:2px}
  .stamina-fill{height:100%;width:100%;background:#ffcc00;transition:width .1s ease-out;border-radius:4px}
  #p2-ui .stamina-bg{transform:scaleX(-1);margin-left:auto;margin-right:0}

  #roundText{position:absolute;top:40%;left:50%;transform:translate(-50%, -50%) scale(0);
    font-size:80px;font-weight:900;color:#ffcc00;text-shadow:0 0 40px #ffcc00, 0 0 80px #ff8800;
    opacity:0;transition:all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);pointer-events:none;text-align:center;white-space:nowrap}
  #roundText.show{opacity:1;transform:translate(-50%, -50%) scale(1.2)}

  /* Butang Kawalan Sentuh */
  #controls{position:fixed;inset:0;pointer-events:none;z-index:20;display:none}
  .btn{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(255,255,255,.3);
    background:rgba(0,0,0,.5);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:12px;color:#fff;transition:transform .1s, background .1s;
    box-shadow:0 0 15px rgba(0,0,0,0.5);text-align:center}
  .btn.active{transform:scale(.9);background:rgba(255,255,255,.3)}
  .btn:disabled{opacity:0.3;pointer-events:none;filter:grayscale(1)}

  /* P1 Kawalan (Kiri) */
  #p1-controls{position:absolute;bottom:20px;left:20px;width:180px;height:180px}
  #p1-controls .up{left:60px;bottom:60px;width:60px;height:60px}
  #p1-controls .down{left:60px;bottom:0px;width:60px;height:60px}
  #p1-controls .left{left:0;bottom:30px;width:60px;height:60px}
  #p1-controls .right{left:120px;bottom:30px;width:60px;height:60px}

  /* P2 Kawalan (Kanan) */
  #p2-controls{position:absolute;bottom:20px;right:20px;width:220px;height:180px}
  #p2-controls .jab{right:100px;bottom:0px;width:70px;height:70px;background:rgba(0,255,255,.2);border-color:#00ffff;color:#00ffff}
  #p2-controls .hook{right:20px;bottom:0px;width:70px;height:70px;background:rgba(255,204,0,.2);border-color:#ffcc00;color:#ffcc00}
  #p2-controls .uppercut{right:60px;bottom:80px;width:70px;height:70px;background:rgba(255,0,85,.2);border-color:#ff0055;color:#ff0055}
  #p2-controls .block{right:170px;bottom:60px;width:60px;height:60px;border-radius:50%;border-color:#aaa;color:#aaa;font-size:16px}

  #startScreen{position:fixed;inset:0;z-index:100;background:radial-gradient(circle at center, #002222, #000);
    display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s;padding:20px}
  #startScreen.hide{opacity:0;pointer-events:none}
  #startScreen h1{font-size:36px;color:#00ffff;text-shadow:0 0 20px #00ffff, 0 0 40px #0088ff;letter-spacing:4px;margin-bottom:10px;text-align:center;line-height:1.1}
  #startScreen p{opacity:0.7;margin-bottom:20px;letter-spacing:1px}
  
  .start-btn{padding:15px 30px;font-size:16px;font-weight:900;color:#000;background:#00ffff;
    border:none;border-radius:30px;cursor:pointer;box-shadow:0 0 30px #00ffff;letter-spacing:2px;margin:8px;width:280px}
  .start-btn.blue{background:#ff0055;box-shadow:0 0 30px #ff0055;color:#fff;}
</style>
</head>
<body>

<div id="bloodOverlay"></div>

<div id="rotateWarn">
  <h2>PUSING TELEFON</h2>
  <p>Baringkan iPhone untuk masuk ke gelanggang.</p>
</div>

<canvas id="game"></canvas>

<div id="hud">
  <div id="p1-ui" class="stats-container">
    <div class="name" style="color:#00ffff">PEMAIN 1</div>
    <div class="bar-bg"><div class="health-fill" id="p1-fill"></div></div>
    <div class="bar-bg stamina-bg"><div class="stamina-fill" id="p1-stamina"></div></div>
  </div>
  <div id="p2-ui" class="stats-container">
    <div class="name" style="color:#ff0055" id="p2-name">BOT / PEMAIN 2</div>
    <div class="bar-bg"><div class="health-fill" id="p2-fill"></div></div>
    <div class="bar-bg stamina-bg"><div class="stamina-fill" id="p2-stamina"></div></div>
  </div>
  <div id="roundText">ROUND 1</div>
</div>

<div id="controls">
  <div id="p1-controls">
    <div class="btn up" data-k="p1_forward">▲</div>
    <div class="btn down" data-k="p1_back">▼</div>
    <div class="btn left" data-k="p1_left">◀</div>
    <div class="btn right" data-k="p1_right">▶</div>
  </div>
  <div id="p2-controls">
    <div class="btn jab" data-k="p1_jab">JAB</div>
    <div class="btn hook" data-k="p1_hook">HOOK</div>
    <div class="btn uppercut" data-k="p1_uppercut">UPPER</div>
    <div class="btn block" data-k="p1_block">🛡️</div>
  </div>
</div>

<div id="startScreen">
  <h1>NEON BOXING<br>3D PRO</h1>
  <p>PILIH MOD PERMAINAN</p>
  <button class="start-btn" id="btnP1">1 PEMAIN (LAWAN BOT)</button>
  <button class="start-btn blue" id="btn2P">2 PEMAIN (KONGSI SKRIN)</button>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
function initAudio() { if (!audioCtx) audioCtx = new AudioContext(); }
function playPunchSound(isHeavy) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.type = 'sawtooth'; osc.frequency.setValueAtTime(isHeavy ? 80 : 150, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.2);
  gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
  osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.2);
}
function playBellSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator(); const gain = audioCtx.createGain();
  osc.type = 'sine'; osc.frequency.setValueAtTime(800, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.5, audioCtx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 1.5);
  osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 1.5);
}

const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050000);
scene.fog = new THREE.FogExp2(0x050000, 0.02);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 100);

const renderScene = new RenderPass(scene, camera);
const bloomPass = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.0, 0.4, 0.85);
const composer = new EffectComposer(renderer);
composer.addPass(renderScene);
composer.addPass(bloomPass);

scene.add(new THREE.AmbientLight(0xffffff, 0.4));
const spot1 = new THREE.SpotLight(0xffffff, 5, 50, Math.PI/3, 0.5, 1);
spot1.position.set(0, 20, 10); spot1.target.position.set(0,0,0);
scene.add(spot1); scene.add(spot1.target);
const spot2 = new THREE.SpotLight(0xff0055, 2, 50, Math.PI/3, 0.5, 1);
spot2.position.set(0, 15, -10); spot2.target.position.set(0,0,0);
scene.add(spot2); scene.add(spot2.target);

// GELANGGANG
const ringGroup = new THREE.Group();
scene.add(ringGroup);
const matTex = (() => {
  const c = document.createElement('canvas'); c.width = 512; c.height = 512;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#111'; ctx.fillRect(0,0,512,512);
  ctx.fillStyle = '#00ffff'; ctx.beginPath(); ctx.arc(256,256,200,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#ff0055'; ctx.beginPath(); ctx.arc(256,256,100,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#111'; ctx.font = 'bold 60px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('PRO', 256, 275);
  return new THREE.CanvasTexture(c);
})();
const canvasMat = new THREE.MeshStandardMaterial({map: matTex, roughness: 0.8});
const ringFloor = new THREE.Mesh(new THREE.BoxGeometry(16, 1, 16), canvasMat);
ringFloor.position.y = 1; ringGroup.add(ringFloor);

const postMat = new THREE.MeshStandardMaterial({color: 0x222222, metalness: 0.8});
const ropeMat = new THREE.MeshStandardMaterial({color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 0.5});
const postPositions = [[-8, -8], [8, -8], [-8, 8], [8, 8]];
for (const [x, z] of postPositions) {
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 4, 8), postMat);
  post.position.set(x, 3, z); ringGroup.add(post);
}
for (let i = 1; i <= 3; i++) {
  const y = i * 1.2 + 0.5; const rGeoH = new THREE.CylinderGeometry(0.04, 0.04, 16, 6);
  const r1 = new THREE.Mesh(rGeoH, ropeMat); r1.rotation.z = Math.PI/2; r1.position.set(0, y, -8); ringGroup.add(r1);
  const r2 = new THREE.Mesh(rGeoH, ropeMat); r2.rotation.z = Math.PI/2; r2.position.set(0, y, 8); ringGroup.add(r2);
  const r3 = new THREE.Mesh(rGeoH, ropeMat); r3.rotation.x = Math.PI/2; r3.position.set(-8, y, 0); ringGroup.add(r3);
  const r4 = new THREE.Mesh(rGeoH, ropeMat); r4.rotation.x = Math.PI/2; r4.position.set(8, y, 0); ringGroup.add(r4);
}

/* ============================================================
   SISTEM LUKA & DARAH (DYNAMIC CANVAS TEXTURE)
   ============================================================ */
const faceCanvasP1 = document.createElement('canvas');
faceCanvasP1.width = 256; faceCanvasP1.height = 256;
const faceCanvasP2 = document.createElement('canvas');
faceCanvasP2.width = 256; faceCanvasP2.height = 256;

const imgP1 = new Image(); imgP1.crossOrigin = "Anonymous";
imgP1.src = '5B782A7C-39CB-47F2-B3B8-34D6B6A1B3A3.jpg';
const imgP2 = new Image(); imgP2.crossOrigin = "Anonymous";
imgP2.src = 'A7A93CAB-7AD7-4122-9ACA-707B76DFED7E.jpg';

function updateFaceTexture(boxer, health, isP1) {
  const canvas = isP1 ? faceCanvasP1 : faceCanvasP2;
  const ctx = canvas.getContext('2d');
  const img = isP1 ? imgP1 : imgP2;
  const damage = 100 - health;

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (img.complete && img.naturalHeight !== 0) {
    // Scale image to fit canvas keeping aspect ratio
    const scale = Math.max(canvas.width / img.width, canvas.height / img.height);
    const x = (canvas.width / 2) - (img.width / 2) * scale;
    const y = (canvas.height / 2) - (img.height / 2) * scale;
    ctx.drawImage(img, x, y, img.width * scale, img.height * scale);
  }

  // Tambah Kesan Luka & Darah
  if (damage > 25) {
    // Lebam mata (Biru/Hitam)
    ctx.fillStyle = 'rgba(40, 20, 80, 0.6)';
    ctx.beginPath();
    ctx.ellipse(canvas.width * 0.3, canvas.height * 0.4, 20, 15, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  
  if (damage > 50) {
    // Darah kat hidung / mulut
    ctx.fillStyle = 'rgba(200, 0, 0, 0.8)';
    ctx.beginPath();
    ctx.ellipse(canvas.width * 0.5, canvas.height * 0.65, 10, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    // Titisan darah
    ctx.fillRect(canvas.width * 0.48, canvas.height * 0.65, 4, 30);
  }

  if (damage > 75) {
    // Lebam teruk
    ctx.fillStyle = 'rgba(20, 10, 40, 0.8)';
    ctx.beginPath();
    ctx.ellipse(canvas.width * 0.7, canvas.height * 0.4, 25, 20, 0, 0, Math.PI * 2);
    ctx.fill();
    
    // Darah lebih banyak
    ctx.fillStyle = 'rgba(150, 0, 0, 0.9)';
    ctx.beginPath();
    ctx.arc(canvas.width * 0.4, canvas.height * 0.55, 8, 0, Math.PI*2);
    ctx.fill();
    ctx.fillRect(canvas.width * 0.6, canvas.height * 0.3, 3, 50); // Darah dari dahi
  }

  const tex = new THREE.CanvasTexture(canvas);
  boxer.userData.faceMesh.material.map = tex;
  boxer.userData.faceMesh.material.needsUpdate = true;
}

// Panggil sekali awal untuk load gambar
setTimeout(() => {
  updateFaceTexture(p1, 100, true);
  updateFaceTexture(p2, 100, false);
}, 1000);

function createBoxer(colorHex, isPlayer) {
  const root = new THREE.Group();
  const skinMat = new THREE.MeshStandardMaterial({color: 0xc68642, roughness: 0.7});
  const gloveMat = new THREE.MeshStandardMaterial({color: colorHex, roughness: 0.4});
  
  // Guna CanvasTexture sebagai material muka
  const faceMat = new THREE.MeshStandardMaterial({ 
    map: new THREE.CanvasTexture(isPlayer ? faceCanvasP1 : faceCanvasP2), 
    color: 0xffffff, roughness: 0.5 
  });

  const torso = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.4, 0.6), skinMat);
  torso.position.y = 3.8; root.add(torso);
  
  const shorts = new THREE.Mesh(new THREE.BoxGeometry(1.3, 0.8, 0.7), gloveMat);
  shorts.position.y = 2.8; root.add(shorts);

  const headGroup = new THREE.Group();
  headGroup.position.set(0, 4.8, 0); root.add(headGroup);
  
  const headMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 0.7, 16), skinMat);
  headMesh.rotation.x = Math.PI/2;
  headGroup.add(headMesh);
  
  const faceMesh = new THREE.Mesh(new THREE.PlaneGeometry(0.65, 0.65), faceMat);
  faceMesh.position.set(0, 0, 0.36); 
  headGroup.add(faceMesh);

  const armL_Group = new THREE.Group();
  armL_Group.position.set(-0.7, 4.4, 0); root.add(armL_Group);
  const upperArmL = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.12, 1, 8), skinMat);
  upperArmL.position.y = -0.5; armL_Group.add(upperArmL);
  const forearmL_Group = new THREE.Group();
  forearmL_Group.position.y = -1; armL_Group.add(forearmL_Group);
  const forearmL = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.8, 8), skinMat);
  forearmL.position.y = -0.4; forearmL_Group.add(forearmL);
  const gloveL = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 12), gloveMat);
  gloveL.position.y = -0.9; forearmL_Group.add(gloveL);

  const armR_Group = new THREE.Group();
  armR_Group.position.set(0.7, 4.4, 0); root.add(armR_Group);
  const upperArmR = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.12, 1, 8), skinMat);
  upperArmR.position.y = -0.5; armR_Group.add(upperArmR);
  const forearmR_Group = new THREE.Group();
  forearmR_Group.position.y = -1; armR_Group.add(forearmR_Group);
  const forearmR = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.1, 0.8, 8), skinMat);
  forearmR.position.y = -0.4; forearmR_Group.add(forearmR);
  const gloveR = new THREE.Mesh(new THREE.SphereGeometry(0.22, 12, 12), gloveMat);
  gloveR.position.y = -0.9; forearmR_Group.add(gloveR);

  const legL = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.15, 1.8, 8), skinMat);
  legL.position.set(-0.3, 1.8, 0); root.add(legL);
  const legR = new THREE.Mesh(new THREE.CylinderGeometry(0.18, 0.15, 1.8, 8), skinMat);
  legR.position.set(0.3, 1.8, 0); root.add(legR);

  root.userData = {
    parts: { torso, headGroup, faceMesh, armL_Group, forearmL_Group, armR_Group, forearmR_Group, legL, legR, gloveR },
    velocity: new THREE.Vector3(),
    health: 100, maxHealth: 100,
    stamina: 100,
    state: 'idle', 
    stateTimer: 0,
    isKnockedOut: false,
    hitConnection: false,
    isPlayer: isPlayer
  };
  return root;
}

const p1 = createBoxer(0x00ffff, true); 
p1.position.set(0, 1, 5); p1.rotation.y = Math.PI; scene.add(p1);

const p2 = createBoxer(0xff0055, false);
p2.position.set(0, 1, -5); p2.rotation.y = 0; scene.add(p2);

/* ============================================================
   KAWALAN & STATE
   ============================================================ */
let gameMode = 'menu';
let roundState = 'intro'; 
let roundTimer = 3.5; 
const bloodOverlay = document.getElementById('bloodOverlay');

const keys = { 
  p1_forward:false, p1_back:false, p1_left:false, p1_right:false, 
  p1_jab:false, p1_hook:false, p1_uppercut:false, p1_block:false
};

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if(k==='w') keys.p1_forward = true; if(k==='s') keys.p1_back = true;
  if(k==='a') keys.p1_left = true; if(k==='d') keys.p1_right = true;
  if(k==='j') keys.p1_jab = true; if(k==='k') keys.p1_hook = true; 
  if(k==='l') keys.p1_uppercut = true; if(k==='h') keys.p1_block = true;
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if(k==='w') keys.p1_forward = false; if(k==='s') keys.p1_back = false;
  if(k==='a') keys.p1_left = false; if(k==='d') keys.p1_right = false;
  if(k==='j') keys.p1_jab = false; if(k==='k') keys.p1_hook = false; 
  if(k==='l') keys.p1_uppercut = false; if(k==='h') keys.p1_block = false;
});

document.querySelectorAll('[data-k]').forEach(btn => {
  const k = btn.dataset.k;
  const on = e => { e.preventDefault(); keys[k] = true; btn.classList.add('active'); };
  const off = e => { e.preventDefault(); keys[k] = false; btn.classList.remove('active'); };
  btn.addEventListener('touchstart', on, {passive:false});
  btn.addEventListener('touchend', off);
  btn.addEventListener('touchcancel', off);
  btn.addEventListener('mousedown', on);
  btn.addEventListener('mouseup', off);
});

/* ============================================================
   LOGIK ANIMASI & TUMBUKAN
   ============================================================ */
const arenaLimit = 6.5;
let hitStopTimer = 0;

function updateBoxer(boxer, dt) {
  const ud = boxer.userData;
  const parts = ud.parts;
  
  if (hitStopTimer > 0) dt *= 0.1;

  if (ud.isKnockedOut) {
    boxer.rotation.x += (Math.PI/2 - boxer.rotation.x) * dt * 5;
    boxer.position.y += (0.3 - boxer.position.y) * dt * 5;
    return;
  }

  boxer.position.x = Math.max(-arenaLimit, Math.min(arenaLimit, boxer.position.x));
  boxer.position.z = Math.max(-arenaLimit, Math.min(arenaLimit, boxer.position.z));

  if(ud.stateTimer > 0) { 
    ud.stateTimer -= dt; 
    if(ud.stateTimer <= 0) {
      ud.state = 'idle';
      ud.hitConnection = false;
    }
  }

  const lerpSpeed = 15 * dt;
  
  if (ud.state === 'idle' || ud.state === 'walk') {
    const breath = Math.sin(performance.now() * 0.005) * 0.05;
    parts.torso.position.y = 3.8 + breath;
    parts.headGroup.position.y = 4.8 + breath;
    
    parts.armR_Group.rotation.x = THREE.MathUtils.lerp(parts.armR_Group.rotation.x, -1.2, lerpSpeed);
    parts.armR_Group.rotation.z = THREE.MathUtils.lerp(parts.armR_Group.rotation.z, 0.3, lerpSpeed);
    parts.forearmR_Group.rotation.x = THREE.MathUtils.lerp(parts.forearmR_Group.rotation.x, -1.5, lerpSpeed);
    
    parts.armL_Group.rotation.x = THREE.MathUtils.lerp(parts.armL_Group.rotation.x, -1.2, lerpSpeed);
    parts.armL_Group.rotation.z = THREE.MathUtils.lerp(parts.armL_Group.rotation.z, -0.3, lerpSpeed);
    parts.forearmL_Group.rotation.x = THREE.MathUtils.lerp(parts.forearmL_Group.rotation.x, -1.5, lerpSpeed);
    
    if(Math.abs(ud.velocity.x) > 0.1 || Math.abs(ud.velocity.z) > 0.1) {
      ud.state = 'walk';
      const walkCycle = performance.now() * 0.01;
      parts.legL.rotation.x = Math.sin(walkCycle) * 0.4;
      parts.legR.rotation.x = -Math.sin(walkCycle) * 0.4;
    } else {
      ud.state = 'idle';
      parts.legL.rotation.x = THREE.MathUtils.lerp(parts.legL.rotation.x, 0, lerpSpeed);
      parts.legR.rotation.x = THREE.MathUtils.lerp(parts.legR.rotation.x, 0, lerpSpeed);
    }
  } 
  else if (ud.state === 'jab') {
    parts.armR_Group.rotation.x = THREE.MathUtils.lerp(parts.armR_Group.rotation.x, -Math.PI/2, lerpSpeed*2);
    parts.armR_Group.rotation.z = THREE.MathUtils.lerp(parts.armR_Group.rotation.z, 0, lerpSpeed*2);
    parts.forearmR_Group.rotation.x = THREE.MathUtils.lerp(parts.forearmR_Group.rotation.x, 0, lerpSpeed*2);
  }
  else if (ud.state === 'hook') {
    parts.armL_Group.rotation.x = THREE.MathUtils.lerp(parts.armL_Group.rotation.x, -Math.PI/2, lerpSpeed*2);
    parts.armL_Group.rotation.z = THREE.MathUtils.lerp(parts.armL_Group.rotation.z, -1.5, lerpSpeed*2);
    parts.forearmL_Group.rotation.x = THREE.MathUtils.lerp(parts.forearmL_Group.rotation.x, 0, lerpSpeed*2);
  }
  else if (ud.state === 'uppercut') {
    parts.armR_Group.rotation.x = THREE.MathUtils.lerp(parts.armR_Group.rotation.x, -0.5, lerpSpeed*2);
    parts.armR_Group.rotation.z = THREE.MathUtils.lerp(parts.armR_Group.rotation.z, 0.8, lerpSpeed*2);
    parts.forearmR_Group.rotation.x = THREE.MathUtils.lerp(parts.forearmR_Group.rotation.x, -Math.PI, lerpSpeed*2);
    parts.torso.rotation.x = THREE.MathUtils.lerp(parts.torso.rotation.x, -0.2, lerpSpeed*2);
  }
  else if (ud.state === 'block') {
    parts.armR_Group.rotation.x = THREE.MathUtils.lerp(parts.armR_Group.rotation.x, -2, lerpSpeed*2);
    parts.armR_Group.rotation.z = THREE.MathUtils.lerp(parts.armR_Group.rotation.z, 0.1, lerpSpeed*2);
    parts.forearmR_Group.rotation.x = THREE.MathUtils.lerp(parts.forearmR_Group.rotation.x, -2, lerpSpeed*2);
    
    parts.armL_Group.rotation.x = THREE.MathUtils.lerp(parts.armL_Group.rotation.x, -2, lerpSpeed*2);
    parts.armL_Group.rotation.z = THREE.MathUtils.lerp(parts.armL_Group.rotation.z, -0.1, lerpSpeed*2);
    parts.forearmL_Group.rotation.x = THREE.MathUtils.lerp(parts.forearmL_Group.rotation.x, -2, lerpSpeed*2);
    parts.torso.rotation.x = THREE.MathUtils.lerp(parts.torso.rotation.x, 0.2, lerpSpeed*2);
  }
  else if (ud.state === 'hit') {
    parts.torso.rotation.x = THREE.MathUtils.lerp(parts.torso.rotation.x, 0.3, lerpSpeed*3);
    parts.headGroup.rotation.x = THREE.MathUtils.lerp(parts.headGroup.rotation.x, -0.4, lerpSpeed*3);
    parts.armR_Group.rotation.x = THREE.MathUtils.lerp(parts.armR_Group.rotation.x, 0, lerpSpeed*3);
    parts.armL_Group.rotation.x = THREE.MathUtils.lerp(parts.armL_Group.rotation.x, 0, lerpSpeed*3);
  }

  ud.velocity.x *= 0.85; 
  ud.velocity.z *= 0.85; 
  boxer.position.x += ud.velocity.x * dt;
  boxer.position.z += ud.velocity.z * dt;
}

function checkPunchHit(attacker, defender, punchType) {
  const ud = attacker.userData;
  if (ud.hitConnection) return;

  const dist = Math.hypot(attacker.position.x - defender.position.x, attacker.position.z - defender.position.z);
  let range = 2.2; let dmg = 0; let isHeavy = false;

  if (punchType === 'jab') { range = 2.5; dmg = 5; }
  if (punchType === 'hook') { range = 2.0; dmg = 10; isHeavy = true; }
  if (punchType === 'uppercut') { range = 1.8; dmg = 15; isHeavy = true; }

  if (dist < range) {
    ud.hitConnection = true;
    const defUd = defender.userData;
    
    if (defUd.state === 'block') {
      dmg = dmg * 0.1; 
      defUd.stamina -= 5;
      playPunchSound(false);
      showComboText("BLOCKED!");
    } else {
      defUd.health -= dmg;
      defUd.stamina -= 10;
      defUd.state = 'hit';
      defUd.stateTimer = 0.4;
      
      const dir = new THREE.Vector3().subVectors(defender.position, attacker.position).normalize();
      defUd.velocity.x = dir.x * 5;
      defUd.velocity.z = dir.z * 5;
      
      hitStopTimer = 0.08; 
      camera.position.x += (Math.random()-0.5) * 0.5; 
      
      playPunchSound(isHeavy);
      showComboText(punchType.toUpperCase() + "!");
      
      // Kesan Darah (Percikan)
      createBloodSplatter(defender.position.clone().setY(4.5), isHeavy);
      
      // Update Muka (Luka)
      updateFaceTexture(defender, defUd.health, defUd.isPlayer);

      // Kalau player kena tumbuk, bagi skrin merah
      if (defUd.isPlayer) {
        bloodOverlay.classList.add('show');
        setTimeout(() => bloodOverlay.classList.remove('show'), 200);
      }
    }
    updateHealthUI();
  }
}

function handlePlayerInput(dt) {
  const ud = p1.userData;
  if (ud.state === 'hit' || ud.isKnockedOut || roundState === 'intro' || gameMode === 'over') return;

  const accel = 15;
  if (keys.p1_forward) ud.velocity.z -= accel * dt;
  if (keys.p1_back) ud.velocity.z += accel * dt;
  if (keys.p1_left) ud.velocity.x -= accel * dt;
  if (keys.p1_right) ud.velocity.x += accel * dt;

  if (ud.state === 'jab' || ud.state === 'hook' || ud.state === 'uppercut' || ud.state === 'block') return;

  if (keys.p1_block) {
    ud.state = 'block';
  } else if (keys.p1_jab && ud.stamina > 10) {
    ud.state = 'jab'; ud.stateTimer = 0.3; ud.stamina -= 10; keys.p1_jab = false;
    setTimeout(() => checkPunchHit(p1, p2, 'jab'), 150);
  } else if (keys.p1_hook && ud.stamina > 20) {
    ud.state = 'hook'; ud.stateTimer = 0.4; ud.stamina -= 20; keys.p1_hook = false;
    setTimeout(() => checkPunchHit(p1, p2, 'hook'), 200);
  } else if (keys.p1_uppercut && ud.stamina > 30) {
    ud.state = 'uppercut'; ud.stateTimer = 0.5; ud.stamina -= 30; keys.p1_uppercut = false;
    setTimeout(() => checkPunchHit(p1, p2, 'uppercut'), 250);
  }
}

function handleBotAI(dt) {
  const ud = p2.userData;
  if (ud.state === 'hit' || ud.isKnockedOut || roundState === 'intro' || gameMode === 'over') return;

  const dist = Math.hypot(p1.position.x - p2.position.x, p1.position.z - p2.position.z);
  
  if (dist > 2.5 && ud.state !== 'jab' && ud.state !== 'hook' && ud.state !== 'uppercut') {
    ud.state = 'walk';
    const dir = new THREE.Vector3().subVectors(p1.position, p2.position).normalize();
    ud.velocity.x = dir.x * 4;
    ud.velocity.z = dir.z * 4;
  } else {
    ud.velocity.x = 0; ud.velocity.z = 0;
  }

  if (ud.state !== 'jab' && ud.state !== 'hook' && ud.state !== 'uppercut' && ud.state !== 'hit') {
    if (Math.random() < 0.05) {
      const r = Math.random();
      if (dist < 3) {
        if (r < 0.4) {
          ud.state = 'block';
          setTimeout(() => { if(ud.state === 'block') ud.state = 'idle'; }, 800);
        } else if (r < 0.7) {
          ud.state = 'jab'; ud.stateTimer = 0.3; setTimeout(() => checkPunchHit(p2, p1, 'jab'), 150);
        } else {
          ud.state = 'hook'; ud.stateTimer = 0.4; setTimeout(() => checkPunchHit(p2, p1, 'hook'), 200);
        }
      }
    }
  }
}

/* ============================================================
   PARTIKEL DARAH & UI
   ============================================================ */
const particles = [];
function createBloodSplatter(pos, isHeavy) {
  const count = isHeavy ? 20 : 8;
  for(let i=0; i<count; i++) {
    // Guna warna merah darah
    const p = new THREE.Mesh(new THREE.BoxGeometry(0.1,0.1,0.1), new THREE.MeshBasicMaterial({color: 0xcc0000}));
    p.position.copy(pos);
    const vel = new THREE.Vector3((Math.random()-0.5)*15, Math.random()*15, (Math.random()-0.5)*15);
    p.userData = { vel, life: 0.6 }; scene.add(p); particles.push(p);
  }
}
function updateParticles(dt) {
  for(let i=particles.length-1; i>=0; i--) {
    const p = particles[i]; p.position.addScaledVector(p.userData.vel, dt);
    p.userData.vel.y -= 30 * dt; p.userData.life -= dt; p.scale.setScalar(p.userData.life * 2);
    if(p.userData.life <= 0) { scene.remove(p); particles.splice(i, 1); }
  }
}

const p1Fill = document.getElementById('p1-fill'); const p2Fill = document.getElementById('p2-fill');
const p1Stamina = document.getElementById('p1-stamina'); const p2Stamina = document.getElementById('p2-stamina');
const comboTxt = document.getElementById('comboText');
const roundTxt = document.getElementById('roundText');

function updateHealthUI() {
  p1Fill.style.width = Math.max(0, p1.userData.health) + '%';
  p2Fill.style.width = Math.max(0, p2.userData.health) + '%';
  p1Stamina.style.width = Math.max(0, p1.userData.stamina) + '%';
  p2Stamina.style.width = Math.max(0, p2.userData.stamina) + '%';
}
function showComboText(text) {
  if(!comboTxt) return;
  comboTxt.textContent = text; comboTxt.classList.add('show');
  setTimeout(() => comboTxt.classList.remove('show'), 800);
}
function showRoundText(text) {
  roundTxt.textContent = text; roundTxt.classList.add('show');
}

let last = performance.now();
function checkGameOver() {
  if(gameMode === 'menu' || gameMode === 'over') return;
  
  if(p1.userData.health <= 0 || p2.userData.health <= 0) {
    gameMode = 'over';
    showRoundText("K.O!");
    playBellSound();
    
    p1.userData.isKnockedOut = true;
    p2.userData.isKnockedOut = true;
    
    setTimeout(() => {
      roundTxt.classList.remove('show');
      p1.userData.health = 100; p2.userData.health = 100;
      p1.userData.stamina = 100; p2.userData.stamina = 100;
      p1.position.set(0, 1, 5); p2.position.set(0, 1, -5);
      p1.rotation.set(0, Math.PI, 0); p2.rotation.set(0, 0, 0);
      p1.userData.velocity.set(0,0,0); p2.userData.velocity.set(0,0,0);
      p1.userData.state = 'idle'; p2.userData.state = 'idle';
      p1.userData.isKnockedOut = false; p2.userData.isKnockedOut = false;
      
      // Reset Muka & Darah
      updateFaceTexture(p1, 100, true);
      updateFaceTexture(p2, 100, false);
      
      roundState = 'intro'; roundTimer = 3.5;
      showRoundText("ROUND 1");
      setTimeout(() => { showRoundText("FIGHT!"); playBellSound(); roundState = 'fighting'; setTimeout(()=>roundTxt.classList.remove('show'), 1000); }, 2500);
      
      gameMode = window.currentMode || 'p1';
      updateHealthUI();
    }, 4000);
  }
}

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now(); let dt = (now - last) / 1000; last = now;
  if(dt > 0.05) dt = 0.05;
  
  if (hitStopTimer > 0) hitStopTimer -= dt;

  if (roundState === 'intro' && gameMode !== 'menu') {
    roundTimer -= dt;
    if (roundTimer <= 0) {
      roundState = 'fighting';
      roundTxt.classList.remove('show');
    }
  }

  if(gameMode === 'p1' || gameMode === 'p2') {
    const p1Pos = p1.position;
    const p2Pos = p2.position;
    const camTarget = new THREE.Vector3(p1Pos.x, p1Pos.y + 3, p1Pos.z + 6);
    
    camera.position.lerp(camTarget, dt * 5);
    camera.lookAt(p2Pos.x, p2Pos.y + 3.5, p2Pos.z);

    p1.visible = true; p2.visible = true; 
    handlePlayerInput(dt); handleBotAI(dt);
  } else if (gameMode === 'local') {
    p1.visible = true; p2.visible = true;
    const midX = (p1.position.x + p2.position.x) / 2;
    const targetCamZ = (p1.position.z + p2.position.z) / 2 + 10;
    camera.position.x += (midX - camera.position.x) * dt * 3;
    camera.position.z += (targetCamZ - camera.position.z) * dt * 3;
    camera.position.y = 5;
    camera.lookAt(midX, 3, (p1.position.z + p2.position.z) / 2);
    
    handlePlayerInput(dt); 
  }
  
  if (gameMode !== 'menu' && gameMode !== 'over') {
    updateBoxer(p1, dt); updateBoxer(p2, dt);
    updateHealthUI();
  }
  
  checkGameOver();
  updateParticles(dt);

  composer.render();
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

function startGame(mode) {
  initAudio();
  gameMode = mode;
  window.currentMode = mode;
  document.getElementById('startScreen').classList.add('hide');
  document.getElementById('controls').style.display = 'block';
  
  p1.position.set(0, 1, 5); p1.rotation.set(0, Math.PI, 0);
  p2.position.set(0, 1, -5); p2.rotation.set(0, 0, 0);
  p1.userData.health = 100; p2.userData.health = 100;
  p1.userData.stamina = 100; p2.userData.stamina = 100;
  p1.userData.isKnockedOut = false; p2.userData.isKnockedOut = false;
  p1.userData.state = 'idle'; p2.userData.state = 'idle';
  
  updateFaceTexture(p1, 100, true);
  updateFaceTexture(p2, 100, false);
  
  updateHealthUI();

  roundState = 'intro'; roundTimer = 3.5;
  showRoundText("ROUND 1");
  setTimeout(() => { 
    showRoundText("FIGHT!"); 
    playBellSound(); 
    roundState = 'fighting'; 
    setTimeout(()=>roundTxt.classList.remove('show'), 1000); 
  }, 2500);

  if(mode === 'p1') {
    document.getElementById('p1-controls').style.display = 'block';
    document.getElementById('p2-controls').style.display = 'block';
  } else if(mode === 'local') {
    document.getElementById('p1-controls').style.display = 'block';
    document.getElementById('p2-controls').style.display = 'none';
  }
  last = performance.now();
}

document.getElementById('btnP1').addEventListener('click', () => startGame('p1'));
document.getElementById('btn2P').addEventListener('click', () => startGame('local'));

// Preload gambar dan muka
setTimeout(() => {
  updateFaceTexture(p1, 100, true);
  updateFaceTexture(p2, 100, false);
}, 1500);

updateHealthUI(); animate();
</script>
