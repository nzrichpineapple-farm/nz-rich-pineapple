<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>NEON STICK FIGHT 3D</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100vw;height:100vh;overflow:hidden;background:#000;
    font-family:system-ui,-apple-system,sans-serif;user-select:none;touch-action:none;
    position:fixed;top:0;left:0;color:#fff}
  canvas{display:block}

  /* Amaran Landscape */
  #rotateWarn{position:fixed;inset:0;z-index:9999;background:#050510;
    display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  #rotateWarn h2{color:#00ffff;margin-bottom:10px;font-size:24px;text-shadow:0 0 10px #00ffff}
  #rotateWarn p{opacity:0.7}
  @media (orientation: portrait) { #rotateWarn{display:flex} }

  /* HUD */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  
  .health-bar{position:absolute;top:30px;width:35%;height:16px;
    background:rgba(255,255,255,.1);border:2px solid #fff;border-radius:8px;overflow:hidden}
  .health-fill{height:100%;width:100%;transition:width .2s}
  #p1-health{left:20px;border-color:#00ffff}
  #p1-health .health-fill{background:linear-gradient(90deg,#00ffff,#0088ff);box-shadow:0 0 15px #00ffff}
  #p2-health{right:20px;border-color:#ff0055;transform:scaleX(-1)}
  #p2-health .health-fill{background:linear-gradient(90deg,#ff0055,#ff00aa);box-shadow:0 0 15px #ff0055}
  
  #status{position:absolute;top:15%;left:50%;transform:translateX(-50%);
    font-size:40px;font-weight:900;letter-spacing:5px;text-shadow:0 0 20px #fff;opacity:0;transition:opacity .3s}

  /* Butang */
  #controls{position:fixed;inset:0;pointer-events:none;z-index:20}
  .btn{position:absolute;pointer-events:auto;border-radius:50%;border:2px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.1);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:14px;color:#fff;transition:transform .1s}
  .btn.active{transform:scale(.9);background:rgba(255,255,255,.3)}

  .pad{position:absolute;bottom:30px;left:40px;width:140px;height:140px}
  .pad .btn{width:50px;height:50px}
  .pad .left{left:0;top:45px} .pad .right{right:0;top:45px}
  .pad .jump{left:45px;top:-30px;width:50px;height:50px;border-radius:12px;border-color:#00ffff}

  .actions{position:absolute;bottom:30px;right:40px;width:140px;height:140px}
  .actions .shoot{width:80px;height:80px;right:0;bottom:0;background:rgba(255,0,85,.3);border-color:#ff0055;font-size:12px}

  #desktopInfo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    background:rgba(0,0,0,.8);padding:20px;border-radius:12px;text-align:center;display:block;border:1px solid #00ffff}
  @media (pointer:coarse){#desktopInfo{display:none}}
</style>
</head>
<body>

<div id="rotateWarn">
  <h2>PUSING TELEFON</h2>
  <p>Baringkan iPhone untuk pengalaman 3D penuh.</p>
</div>

<canvas id="game"></canvas>

<div id="hud">
  <div class="health-bar" id="p1-health"><div class="health-fill" id="p1-fill"></div></div>
  <div class="health-bar" id="p2-health"><div class="health-fill" id="p2-fill"></div></div>
  <div id="status">FIGHT!</div>
</div>

<div id="controls">
  <div class="pad">
    <div class="btn left" data-k="left">◀</div>
    <div class="btn right" data-k="right">▶</div>
    <div class="btn jump" data-k="jump">Lompat</div>
  </div>
  <div class="actions">
    <div class="btn shoot" data-k="shoot">TEMBAK</div>
  </div>
</div>

<div id="desktopInfo">
  <h3 style="color:#00ffff">Kawalan Desktop</h3>
  <p>A / D : Gerak</p>
  <p>W / Space : Lompat</p>
  <p>Klik Kiri / F : Tembak</p>
</div>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   SETUP 3D
   ============================================================ */
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050510); // Gelap neon
scene.fog = new THREE.FogExp2(0x050510, 0.02);

// Kamera pandangan sisi (Side-scrolling)
const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 8, 25);
camera.lookAt(0, 5, 0);

/* ============================================================
   CAHAYA NEON
   ============================================================ */
const ambient = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambient);
const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
dirLight.position.set(10, 20, 10);
scene.add(dirLight);
// Lampu neon bawah
const neonLight = new THREE.PointLight(0x00ffff, 2, 50);
neonLight.position.set(0, 0, 0);
scene.add(neonLight);

/* ============================================================
   DUNIA (Lantai Grid & Platform)
   ============================================================ */
// Lantai Neon
const gridHelper = new THREE.GridHelper(100, 50, 0x00ffff, 0x004488);
scene.add(gridHelper);

const floorGeo = new THREE.PlaneGeometry(100, 20);
const floorMat = new THREE.MeshStandardMaterial({color:0x020210, transparent:true, opacity:0.8});
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI/2;
floor.position.y = -0.01;
scene.add(floor);

// Platform Tepi (Dinding)
const wallMat = new THREE.MeshStandardMaterial({color:0x111122, emissive:0x002244});
const wallL = new THREE.Mesh(new THREE.BoxGeometry(2, 20, 20), wallMat);
wallL.position.set(-25, 10, 0);
scene.add(wallL);
const wallR = wallL.clone();
wallR.position.x = 25;
scene.add(wallR);

/* ============================================================
   STICKMAN BUILDER
   ============================================================ */
function createStickman(colorHex) {
  const group = new THREE.Group();
  const mat = new THREE.MeshStandardMaterial({color: colorHex, emissive: colorHex, emissiveIntensity: 0.3});
  
  // Kepala
  const head = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 16), mat);
  head.position.y = 5;
  group.add(head);

  // Torso
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 2.5, 8), mat);
  torso.position.y = 3.4;
  group.add(torso);

  // Kaki
  const legGeo = new THREE.CylinderGeometry(0.15, 0.1, 2.2, 8);
  legGeo.translate(0, -1.1, 0); // Pivot di atas
  const legL = new THREE.Mesh(legGeo, mat);
  legL.position.set(-0.3, 2.1, 0);
  group.add(legL);
  const legR = new THREE.Mesh(legGeo, mat);
  legR.position.set(0.3, 2.1, 0);
  group.add(legR);

  // Tangan
  const armGeo = new THREE.CylinderGeometry(0.15, 0.1, 2, 8);
  armGeo.translate(0, -1, 0);
  const armL = new THREE.Mesh(armGeo, mat);
  armL.position.set(-0.4, 4.5, 0);
  group.add(armL);
  const armR = new THREE.Mesh(armGeo, mat);
  armR.position.set(0.4, 4.5, 0);
  group.add(armR);

  // Simpan rujukan untuk animasi
  group.userData = {
    parts: { legL, legR, armL, armR, head, torso },
    velocity: new THREE.Vector3(),
    isGrounded: true,
    hitTimer: 0,
    shootTimer: 0
  };

  return group;
}

/* ============================================================
   PEMAIN & BOT
   ============================================================ */
const player = createStickman(0x00ffff); // Biru Neon
player.position.set(-10, 0, 0);
scene.add(player);
player.userData.health = 100;

const enemy = createStickman(0xff0055); // Merah Neon
enemy.position.set(10, 0, 0);
enemy.rotation.y = Math.PI; // Pandang arah player
scene.add(enemy);
enemy.userData.health = 100;

/* ============================================================
   PELURU
   ============================================================ */
const bullets = [];
const bulletGeo = new THREE.SphereGeometry(0.2, 8, 8);
const bulletMat = new THREE.MeshBasicMaterial({color: 0xffff00});

function spawnBullet(owner, target) {
  const b = new THREE.Mesh(bulletGeo, bulletMat);
  b.position.copy(owner.position);
  b.position.y += 4.5; // Paras dada
  b.position.z += 1;   // Keluar dari badan sikit
  
  // Kira arah tembakan (Auto-aim)
  const dir = new THREE.Vector3().subVectors(target.position, b.position).normalize();
  dir.y = 0; // Tembak lurus
  dir.normalize();
  
  b.userData = {
    velocity: dir.multiplyScalar(40),
    owner: owner
  };
  
  scene.add(b);
  bullets.push(b);
  
  // Kesan Muzzle Flash
  const flash = new THREE.PointLight(0xffff00, 5, 10);
  flash.position.copy(b.position);
  scene.add(flash);
  setTimeout(() => scene.remove(flash), 50);
}

/* ============================================================
   KAWALAN
   ============================================================ */
const keys = { left:false, right:false, jump:false, shoot:false };

addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if(k==='a'||k==='arrowleft') keys.left = true;
  if(k==='d'||k==='arrowright') keys.right = true;
  if(k==='w'||k==='arrowup'||k===' ') keys.jump = true;
  if(k==='f'||k==='shift') keys.shoot = true;
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if(k==='a'||k==='arrowleft') keys.left = false;
  if(k==='d'||k==='arrowright') keys.right = false;
  if(k==='w'||k==='arrowup'||k===' ') keys.jump = false;
  if(k==='f'||k==='shift') keys.shoot = false;
});

document.querySelectorAll('[data-k]').forEach(btn => {
  const k = btn.dataset.k;
  const on = e => { e.preventDefault(); keys[k] = true; btn.classList.add('active'); };
  const off = e => { e.preventDefault(); keys[k] = false; btn.classList.remove('active'); };
  btn.addEventListener('touchstart', on, {passive:false});
  btn.addEventListener('touchend', off);
  btn.addEventListener('touchcancel', off);
  btn.addEventListener('mousedown', on);
  btn.addEventListener('mouseup', off);
});

/* ============================================================
   LOGIK FIZIK & ANIMASI
   ============================================================ */
const gravity = -30;
const jumpForce = 12;
const moveSpeed = 8;
const arenaLimit = 22;

function updateStickman(sm, dt, isPlayer) {
  const ud = sm.userData;
  
  // Kurangkan timer
  if(ud.shootTimer > 0) ud.shootTimer -= dt;
  if(ud.hitTimer > 0) ud.hitTimer -= dt;

  // Fizik Graviti
  ud.velocity.y += gravity * dt;
  sm.position.y += ud.velocity.y * dt;

  // Lantai
  if(sm.position.y <= 0) {
    sm.position.y = 0;
    ud.velocity.y = 0;
    ud.isGrounded = true;
  } else {
    ud.isGrounded = false;
  }

  // Halang keluar gelanggang
  sm.position.x = Math.max(-arenaLimit, Math.min(arenaLimit, sm.position.x));

  // LOGIK ANIMASI
  const parts = ud.parts;
  
  if(ud.hitTimer > 0) {
    // RAGDOLL EFFECT (Kena tembak)
    sm.rotation.z = Math.sin(performance.now()*0.02) * 0.5;
    sm.rotation.x = Math.cos(performance.now()*0.03) * 0.5;
    parts.legL.rotation.x = Math.sin(performance.now()*0.03) * 1;
    parts.legR.rotation.x = -Math.sin(performance.now()*0.03) * 1;
    parts.armL.rotation.x = -Math.sin(performance.now()*0.04) * 1.5;
    parts.armR.rotation.x = Math.sin(performance.now()*0.04) * 1.5;
  } else {
    // Kembali Normal
    sm.rotation.z *= 0.8;
    sm.rotation.x *= 0.8;
    
    // Animasi Jalan (bila gerak)
    if(Math.abs(ud.velocity.x) > 0.1 && ud.isGrounded) {
      const walkCycle = performance.now() * 0.015;
      parts.legL.rotation.x = Math.sin(walkCycle) * 0.8;
      parts.legR.rotation.x = -Math.sin(walkCycle) * 0.8;
      parts.armL.rotation.x = -Math.sin(walkCycle) * 0.5;
      parts.armR.rotation.x = Math.sin(walkCycle) * 0.5;
    } else if (!ud.isGrounded) {
      // Animasi Lompat
      parts.legL.rotation.x = -0.5;
      parts.legR.rotation.x = -0.5;
      parts.armL.rotation.x = -1;
      parts.armR.rotation.x = -1;
    } else {
      // Berdiri diam
      parts.legL.rotation.x *= 0.8;
      parts.legR.rotation.x *= 0.8;
      parts.armL.rotation.x *= 0.8;
      parts.armR.rotation.x *= 0.8;
    }
  }

  // Hadkan Vel X (Geseran)
  ud.velocity.x *= 0.85;
  
  // Arah hadap (Pusing kiri/kanan)
  if(isPlayer) sm.rotation.y = Math.PI/2; // Player sentiasa pandang kanan
  else sm.rotation.y = -Math.PI/2;        // Bot sentiasa pandang kiri
}

function applyInput(dt) {
  const ud = player.userData;
  
  if(keys.left) ud.velocity.x = -moveSpeed;
  if(keys.right) ud.velocity.x = moveSpeed;
  
  if(keys.jump && ud.isGrounded) {
    ud.velocity.y = jumpForce;
    ud.isGrounded = false;
  }
  
  if(keys.shoot && ud.shootTimer <= 0) {
    spawnBullet(player, enemy);
    ud.shootTimer = 0.4; // Cooldown tembak
  }
  
  player.position.x += ud.velocity.x * dt;
}

function updateBot(dt) {
  const ud = enemy.userData;
  const dist = Math.abs(player.position.x - enemy.position.x);
  
  // AI Ringkas: Dekati player kalau jauh, tembak kalau dekat
  if(dist > 12) {
    // Kejar
    ud.velocity.x = player.position.x > enemy.position.x ? moveSpeed * 0.8 : -moveSpeed * 0.8;
    enemy.position.x += ud.velocity.x * dt;
  } else if (dist < 8) {
    // Undur sikit kalau terlalu dekat
    ud.velocity.x = player.position.x > enemy.position.x ? -moveSpeed * 0.5 : moveSpeed * 0.5;
    enemy.position.x += ud.velocity.x * dt;
  } else {
    // Berdiri & tembak
    if(ud.shootTimer <= 0) {
      spawnBullet(enemy, player);
      ud.shootTimer = 0.8 + Math.random() * 0.5; // Random cooldown
    }
  }
  
  // Lompat halang player
  if(dist < 10 && ud.isGrounded && Math.random() < 0.02) {
    ud.velocity.y = jumpForce;
  }
}

/* ============================================================
   KEMASKINI PELURU & COLLISION
   ============================================================ */
function updateBullets(dt) {
  for(let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.position.addScaledVector(b.userData.velocity, dt);
    
    // Kesan kilauan
    b.scale.setScalar(1 + Math.sin(performance.now()*0.05)*0.3);

    // Check collision dengan Player atau Bot
    const target = b.userData.owner === player ? enemy : player;
    
    // Kotak collision ringkas (Bounding Box)
    const distToTarget = b.position.distanceTo(target.position.clone().setY(3)); // Paras badan
    
    if(distToTarget < 2) {
      // KENA TEMBAK!
      target.userData.health -= 15;
      target.userData.hitTimer = 0.6; // Trigger ragdoll
      
      // Knockback
      const knockDir = b.userData.velocity.clone().normalize();
      target.userData.velocity.x += knockDir.x * 10;
      target.userData.velocity.y += 5;
      
      // Kesan letupan
      createExplosion(b.position, 0xffaa00);
      
      scene.remove(b);
      bullets.splice(i, 1);
      updateHealthUI();
      continue;
    }

    // Buang peluru kalau terbang jauh
    if(Math.abs(b.position.x) > 30) {
      scene.remove(b);
      bullets.splice(i, 1);
    }
  }
}

/* ============================================================
   KESAN VISUAL (Partikel)
   ============================================================ */
const particles = [];
function createExplosion(pos, color) {
  for(let i=0; i<8; i++) {
    const p = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,0.2), new THREE.MeshBasicMaterial({color}));
    p.position.copy(pos);
    const vel = new THREE.Vector3((Math.random()-0.5)*10, (Math.random()-0.5)*10, (Math.random()-0.5)*10);
    p.userData = { vel, life: 0.5 };
    scene.add(p);
    particles.push(p);
  }
}

function updateParticles(dt) {
  for(let i=particles.length-1; i>=0; i--) {
    const p = particles[i];
    p.position.addScaledVector(p.userData.vel, dt);
    p.userData.vel.y -= 20 * dt;
    p.userData.life -= dt;
    p.scale.setScalar(p.userData.life * 2);
    
    if(p.userData.life <= 0) {
      scene.remove(p);
      particles.splice(i, 1);
    }
  }
}

/* ============================================================
   UI & GAME LOOP
   ============================================================ */
const p1Fill = document.getElementById('p1-fill');
const p2Fill = document.getElementById('p2-fill');
const statusTxt = document.getElementById('status');

function updateHealthUI() {
  p1Fill.style.width = Math.max(0, player.userData.health) + '%';
  p2Fill.style.width = Math.max(0, enemy.userData.health) + '%';
}

let gameState = 'playing';
let last = performance.now();

function checkGameOver() {
  if(gameState !== 'playing') return;
  if(player.userData.health <= 0 || enemy.userData.health <= 0) {
    gameState = 'over';
    const pWins = enemy.userData.health <= 0;
    statusTxt.textContent = pWins ? "AWAK MENANG!" : "AWAK KALAH!";
    statusTxt.style.color = pWins ? "#00ffff" : "#ff0055";
    statusTxt.style.opacity = 1;
    
    // Fall animation
    player.userData.hitTimer = 999;
    enemy.userData.hitTimer = 999;
    
    setTimeout(() => {
      // Reset game
      player.userData.health = 100;
      enemy.userData.health = 100;
      player.position.set(-10, 0, 0);
      enemy.position.set(10, 0, 0);
      player.userData.velocity.set(0,0,0);
      enemy.userData.velocity.set(0,0,0);
      player.userData.hitTimer = 0;
      enemy.userData.hitTimer = 0;
      statusTxt.style.opacity = 0;
      gameState = 'playing';
      updateHealthUI();
    }, 3000);
  }
}

function animate() {
  requestAnimationFrame(animate);
  const now = performance.now();
  let dt = (now - last) / 1000;
  last = now;
  if(dt > 0.05) dt = 0.05;

  if(gameState === 'playing') {
    applyInput(dt);
    updateBot(dt);
    updateBullets(dt);
  }
  
  updateStickman(player, dt, true);
  updateStickman(enemy, dt, false);
  updateParticles(dt);
  checkGameOver();

  // Kamera ikut player sikit (Dynamic Pan)
  const targetCamX = player.position.x * 0.5;
  camera.position.x += (targetCamX - camera.position.x) * dt * 3;
  camera.lookAt(camera.position.x, 5, 0);

  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Start
updateHealthUI();
animate();
</script>
</body>
</html>
