<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>IPHONE OPEN WORLD - GTA LITE</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
  }
}
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100vw;height:100vh;overflow:hidden;background:#000;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;color:#fff;
    position:fixed;top:0;left:0}
  canvas{display:block}

  /* Amaran Menegak */
  #rotateWarn{position:fixed;inset:0;z-index:9999;background:#111;
    display:none;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:20px}
  #rotateWarn svg{width:80px;height:80px;margin-bottom:20px;animation:rot 2s infinite}
  @keyframes rot{0%{transform:rotate(0)}50%{transform:rotate(90deg)}100%{transform:rotate(90deg)}}
  @media (orientation: portrait) {
    #rotateWarn{display:flex}
  }

  /* HUD */
  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}
  
  .glass{background:rgba(0,0,0,.5);backdrop-filter:blur(10px);
    -webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.15);border-radius:12px}

  #status{position:absolute;top:20px;left:20px;padding:8px 16px;font-weight:800;font-size:14px;letter-spacing:1px}
  #speedo{position:absolute;bottom:20px;right:20px;text-align:right;display:none}
  #speedo .val{font-size:48px;font-weight:900;line-height:1;text-shadow:0 2px 10px #000}
  #speedo .unit{font-size:12px;opacity:.7;letter-spacing:2px}

  /* Kawalan Sentuh */
  #controls{position:fixed;inset:0;pointer-events:none;z-index:20;display:none}
  @media (pointer:coarse){#controls{display:block}}
  
  .ctrl-btn{position:absolute;pointer-events:auto;border:2px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.1);backdrop-filter:blur(5px);border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;
    transition:transform .1s, background .1s}
  .ctrl-btn.active{background:rgba(255,255,255,.4);transform:scale(.9)}

  /* Kiri: Pergerakan/Stereng */
  .dpad{position:absolute;bottom:30px;left:30px;width:160px;height:160px;pointer-events:auto}
  .dpad .btn{position:absolute;width:50px;height:50px;border-radius:12px;
    background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);
    display:flex;align-items:center;justify-content:center;font-size:20px}
  .dpad .up{top:0;left:55px} .dpad .down{bottom:0;left:55px}
  .dpad .left{top:55px;left:0} .dpad .right{top:55px;right:0}

  /* Kanan: Aksi */
  .action-btns{position:absolute;bottom:30px;right:30px;width:200px;height:160px}
  .action-btns .btn{position:absolute;pointer-events:auto;border-radius:50%;
    display:flex;align-items:center;justify-content:center;font-weight:900;font-size:12px;
    letter-spacing:1px;text-align:center;border:2px solid rgba(255,255,255,.3)}
  
  .btn-gas{width:80px;height:80px;right:0;bottom:0;background:rgba(46,230,168,.3);border-color:#2ee6a8}
  .btn-brake{width:60px;height:60px;right:90px;bottom:10px;background:rgba(255,68,102,.3);border-color:#ff4466}
  .btn-enter{width:70px;height:70px;right:20px;bottom:90px;background:rgba(255,204,68,.3);border-color:#ffcc44;display:none}
  .btn-enter.show{display:flex;animation:pulse 1.5s infinite}
  @keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.1)}100%{transform:scale(1)}}

  /* Desktop info */
  #desktopInfo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    background:rgba(0,0,0,.8);padding:20px;border-radius:12px;text-align:center;display:block}
  @media (pointer:coarse){#desktopInfo{display:none}}
</style>
</head>
<body>

<!-- Amaran Pusing Telefon -->
<div id="rotateWarn">
  <svg fill="none" stroke="#2ee6a8" viewBox="0 0 24 24" stroke-width="2">
    <path stroke-linecap="round" stroke-linejoin="round" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
  </svg>
  <h2 style="color:#2ee6a8;margin-bottom:10px">PUSING TELEFON ANDA</h2>
  <p style="opacity:0.7;font-size:14px">Baringkan iPhone (Landscape Mode) untuk pengalaman GTA penuh skrin.</p>
</div>

<canvas id="game"></canvas>

<div id="hud">
  <div id="status" class="glass">DI KAKI</div>
  <div id="speedo">
    <div class="val" id="spdVal">0</div>
    <div class="unit">KM/H</div>
  </div>
</div>

<div id="controls">
  <!-- D-Pad (Kiri) -->
  <div class="dpad">
    <div class="btn up" data-k="up">▲</div>
    <div class="btn down" data-k="down">▼</div>
    <div class="btn left" data-k="left">◀</div>
    <div class="btn right" data-k="right">▶</div>
  </div>
  
  <!-- Aksi (Kanan) -->
  <div class="action-btns">
    <div class="btn btn-enter" id="btnEnter" data-k="enter">MASUK<br>KERETA</div>
    <div class="btn btn-brake" data-k="brake">BREK</div>
    <div class="btn btn-gas" data-k="gas">GAS</div>
  </div>
</div>

<div id="desktopInfo">
  <h3 style="color:#2ee6a8">Kawalan Desktop</h3>
  <p>WASD / Panah: Jalan & Stereng</p>
  <p>Shift: Lari | E: Masuk/Keluar Kereta</p>
  <p style="margin-top:10px;font-size:12px;opacity:0.6">(Guna telefon untuk butang sentuh)</p>
</div>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   SETUP ASAS
   ============================================================ */
const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87CEEB); // Langit biru
scene.fog = new THREE.Fog(0x87CEEB, 40, 150);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 300);

/* ============================================================
   CAHAYA
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1.0);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff5e6, 1.5);
sun.position.set(50, 100, 50);
sun.castShadow = true;
sun.shadow.mapSize.width = 1024;
sun.shadow.mapSize.height = 1024;
sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;
scene.add(sun);

/* ============================================================
   BINA DUNIA (Bandar)
   ============================================================ */
const groundMat = new THREE.MeshStandardMaterial({color:0x2a2a2a}); // Jalan tar
const ground = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), groundMat);
ground.rotation.x = -Math.PI/2;
ground.receiveShadow = true;
scene.add(ground);

// Tepi jalan (Rumput / Kaki lima)
const sideMat = new THREE.MeshStandardMaterial({color:0x444444});
const sidewalk = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), sideMat);
sidewalk.rotation.x = -Math.PI/2;
sidewalk.position.y = -0.01;
scene.add(sidewalk);

// Garisan jalan
const lineMat = new THREE.MeshBasicMaterial({color:0xffcc00});
for(let i=-100; i<=100; i+=10){
  const line = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 4), lineMat);
  line.rotation.x = -Math.PI/2;
  line.position.set(i, 0.02, 0);
  scene.add(line);
  
  const line2 = new THREE.Mesh(new THREE.PlaneGeometry(4, 0.5), lineMat);
  line2.rotation.x = -Math.PI/2;
  line2.position.set(0, 0.02, i);
  scene.add(line2);
}

// Bangunan
const bGeo = new THREE.BoxGeometry(1,1,1);
function makeBuilding(x, z, w, h, d, col){
  const m = new THREE.Mesh(bGeo, new THREE.MeshStandardMaterial({color:col}));
  m.scale.set(w, h, d);
  m.position.set(x, h/2, z);
  m.castShadow = true;
  m.receiveShadow = true;
  scene.add(m);
}
const colors = [0x8b8f96, 0xa39383, 0x7f8b99, 0x9a8f86, 0x6f7a86];
for(let i=0; i<40; i++){
  let x = (Math.random() - 0.5) * 200;
  let z = (Math.random() - 0.5) * 200;
  // Jangan letak bangunan atas jalan
  if(Math.abs(x) < 8 || Math.abs(z) < 8) continue;
  
  makeBuilding(x, z, 10 + Math.random()*10, 15 + Math.random()*30, 10 + Math.random()*10, colors[(Math.random()*colors.length)|0]);
}

/* ============================================================
   PEMAIN (Karakter)
   ============================================================ */
const playerGroup = new THREE.Group();
// Badan
const body = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1, 0.4), new THREE.MeshStandardMaterial({color:0x2255aa}));
body.position.y = 0.8; body.castShadow = true;
playerGroup.add(body);
// Kepala
const head = new THREE.Mesh(new THREE.SphereGeometry(0.25), new THREE.MeshStandardMaterial({color:0xd7a173}));
head.position.y = 1.55; head.castShadow = true;
playerGroup.add(head);
scene.add(playerGroup);

const playerState = {
  x: 0, z: 2, heading: 0,
  speed: 0,
  isDriving: false
};

/* ============================================================
   KERETA (Boleh Dicuri)
   ============================================================ */
const carGroup = new THREE.Group();
const carBody = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.8, 4.2), new THREE.MeshStandardMaterial({color:0xcc2222, metalness:0.4, roughness:0.3}));
carBody.position.y = 0.6; carBody.castShadow = true;
carGroup.add(carBody);
// Bumbung
const carRoof = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.6, 2), new THREE.MeshStandardMaterial({color:0x111111, metalness:0.8}));
carRoof.position.set(0, 1.2, 0.2); carRoof.castShadow = true;
carGroup.add(carRoof);
// Tayar
const wheelGeo = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 12);
const wheelMat = new THREE.MeshStandardMaterial({color:0x111111});
for(let i=0; i<4; i++){
  const w = new THREE.Mesh(wheelGeo, wheelMat);
  w.rotation.z = Math.PI/2;
  w.position.set(i<2?1.1:-1.1, 0.4, i%2===0?1.4:-1.4);
  carGroup.add(w);
}
carGroup.position.set(5, 0, -10);
carGroup.rotation.y = Math.PI/4;
scene.add(carGroup);

/* ============================================================
   INPUT
   ============================================================ */
const keys = {up:false, down:false, left:false, right:false, gas:false, brake:false, enter:false};

// Keyboard
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if(k==='w'||k==='arrowup') keys.up = true;
  if(k==='s'||k==='arrowdown') keys.down = true;
  if(k==='a'||k==='arrowleft') keys.left = true;
  if(k==='d'||k==='arrowright') keys.right = true;
  if(k==='shift') keys.gas = true;
  if(k===' ') keys.brake = true;
  if(k==='e') keys.enter = true;
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if(k==='w'||k==='arrowup') keys.up = false;
  if(k==='s'||k==='arrowdown') keys.down = false;
  if(k==='a'||k==='arrowleft') keys.left = false;
  if(k==='d'||k==='arrowright') keys.right = false;
  if(k==='shift') keys.gas = false;
  if(k===' ') keys.brake = false;
  if(k==='e') keys.enter = false;
});

// Touch Buttons
const btnEnter = document.getElementById('btnEnter');
document.querySelectorAll('[data-k]').forEach(btn => {
  const k = btn.dataset.k;
  const on = e => { e.preventDefault(); keys[k] = true; btn.classList.add('active'); };
  const off = e => { e.preventDefault(); keys[k] = false; btn.classList.remove('active'); };
  btn.addEventListener('touchstart', on, {passive:false});
  btn.addEventListener('touchend', off);
  btn.addEventListener('touchcancel', off);
  btn.addEventListener('mousedown', on);
  btn.addEventListener('mouseup', off);
  btn.addEventListener('mouseleave', off);
});

/* ============================================================
   KAWALAN GAME
   ============================================================ */
const statusUI = document.getElementById('status');
const speedoUI = document.getElementById('speedo');
const spdValUI = document.getElementById('spdVal');

function updatePlayer(dt){
  if(playerState.isDriving){
    /* --- FIZIK KERETA --- */
    const maxSpeed = 30;
    const accel = 15;
    const turnSpeed = 1.5;
    
    // Stereng
    let steerInput = 0;
    if(keys.left) steerInput = 1;
    if(keys.right) steerInput = -1;
    
    // Gas & Brek
    if(keys.gas){
      playerState.speed += accel * dt;
    } else if(keys.brake){
      playerState.speed -= accel * 1.5 * dt;
    } else {
      playerState.speed -= 5 * dt; // Geseran
    }
    
    playerState.speed = Math.max(-maxSpeed/2, Math.min(maxSpeed, playerState.speed));
    
    // Pusing ikut laju (kalau tak bergerak, takleh pusing)
    if(Math.abs(playerState.speed) > 0.5){
      const dir = playerState.speed > 0 ? 1 : -1;
      playerState.heading += steerInput * turnSpeed * dt * dir * Math.min(1, Math.abs(playerState.speed)/10);
    }

    // Kemas kini posisi
    playerState.x -= Math.sin(playerState.heading) * playerState.speed * dt;
    playerState.z -= Math.cos(playerState.heading) * playerState.speed * dt;
    
    // Sync visual kereta
    carGroup.position.set(playerState.x, 0, playerState.z);
    carGroup.rotation.y = playerState.heading;
    
    // Sembunyikan player (sebab dalam kereta)
    playerGroup.visible = false;
    
    // UI
    spdValUI.textContent = Math.round(Math.abs(playerState.speed) * 3.6);
    speedoUI.style.display = 'block';
    statusUI.textContent = "MEMANDU";
    statusUI.style.color = "#2ee6a8";
    btnEnter.style.display = 'none';
    
    // Keluar kereta
    if(keys.enter){
      keys.enter = false;
      playerState.isDriving = false;
      // Letak player kat sebelah kereta
      playerState.x = carGroup.position.x + 3;
      playerState.z = carGroup.position.z;
      btnEnter.style.display = 'flex';
      speedoUI.style.display = 'none';
      statusUI.textContent = "DI KAKI";
      statusUI.style.color = "#fff";
    }

  } else {
    /* --- FIZIK JALAN KAKI --- */
    const walkSpeed = 5;
    let moving = false;
    let dx = 0, dz = 0;
    
    if(keys.up){ dz -= 1; moving = true; }
    if(keys.down){ dz += 1; moving = true; }
    if(keys.left){ dx -= 1; moving = true; }
    if(keys.right){ dx += 1; moving = true; }
    
    if(moving){
      const len = Math.hypot(dx, dz);
      dx /= len; dz /= len;
      
      // Gerak
      playerState.x += dx * walkSpeed * dt;
      playerState.z += dz * walkSpeed * dt;
      
      // Arah tuju badan
      playerState.heading = Math.atan2(-dx, -dz);
    }
    
    // Sync visual
    playerGroup.position.set(playerState.x, 0, playerState.z);
    playerGroup.rotation.y = playerState.heading;
    playerGroup.visible = true;
    
    // Jarak ke kereta
    const distToCar = Math.hypot(playerState.x - carGroup.position.x, playerState.z - carGroup.position.z);
    
    if(distToCar < 5){
      btnEnter.style.display = 'flex';
      if(keys.enter){
        keys.enter = false;
        playerState.isDriving = true;
        playerState.x = carGroup.position.x;
        playerState.z = carGroup.position.z;
        playerState.heading = carGroup.rotation.y;
        playerState.speed = 0;
        btnEnter.style.display = 'none';
        speedoUI.style.display = 'block';
        statusUI.textContent = "MEMANDU";
        statusUI.style.color = "#2ee6a8";
      }
    } else {
      btnEnter.style.display = 'none';
    }
  }
  
  // Kunci kedudukan kereta kalau player jalan kaki (kereta statik)
  if(!playerState.isDriving){
     // Boleh tambah logik kereta berhenti sendiri
  }
}

/* ============================================================
   KAMERA DINAMIK (Third-Person)
   ============================================================ */
const camOffset = new THREE.Vector3(0, 6, 12);
const camLookAt = new THREE.Vector3();
const currentCamPos = new THREE.Vector3();
const currentCamLookAt = new THREE.Vector3();

function updateCamera(dt){
  // Posisi sasaran berdasarkan heading
  const sin = Math.sin(playerState.heading);
  const cos = Math.cos(playerState.heading);
  
  // Offset berputar ikut arah pandang
  const targetX = playerState.x + sin * camOffset.z;
  const targetZ = playerState.z + cos * camOffset.z;
  const targetY = camOffset.y;

  // Smooth follow (Lerp)
  currentCamPos.lerp(new THREE.Vector3(targetX, targetY, targetZ), dt * 5);
  currentCamLookAt.lerp(new THREE.Vector3(playerState.x, 1.5, playerState.z), dt * 8);
  
  camera.position.copy(currentCamPos);
  camera.lookAt(currentCamLookAt);
}

/* ============================================================
   LOOP UTAMA
   ============================================================ */
let last = performance.now();

function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  let dt = (now - last) / 1000;
  last = now;
  if(dt > 0.05) dt = 0.05;

  updatePlayer(dt);
  updateCamera(dt);
  
  // Kunci Langit (Sky follow camera)
  sun.position.set(camera.position.x + 50, 100, camera.position.z + 50);
  sun.target.position.set(camera.position.x, 0, camera.position.z);

  renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Mula
currentCamPos.set(playerState.x, 6, playerState.z + 12);
animate();
</script>
</body>
</html>
