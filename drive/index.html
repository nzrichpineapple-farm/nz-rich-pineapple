<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>DRIVE SIM — LIVING WORLD</title>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    user-select:none;-webkit-user-select:none;touch-action:none;color:#fff}
  canvas{display:block}

  #vignette{position:fixed;inset:0;pointer-events:none;z-index:5;
    background:radial-gradient(ellipse 80% 70% at 50% 55%,transparent 40%,rgba(0,0,0,.72) 100%)}
  #speedlines{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;
    background:radial-gradient(circle at 50% 60%,transparent 25%,rgba(150,230,255,.18) 90%);
    transition:opacity .25s}
  #flash{position:fixed;inset:0;pointer-events:none;z-index:7;background:#ff2233;opacity:0;transition:opacity .1s}
  #nitrotint{position:fixed;inset:0;pointer-events:none;z-index:6;opacity:0;
    background:radial-gradient(circle at 50% 50%,transparent 40%,rgba(80,180,255,.35) 100%);
    transition:opacity .3s}

  #hud{position:fixed;inset:0;pointer-events:none;z-index:10}

  .glass{background:rgba(10,14,24,.55);backdrop-filter:blur(14px);
    -webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.1);border-radius:14px}

  #scorePanel{position:absolute;top:20px;left:20px;padding:10px 16px;min-width:120px}
  #scorePanel .lbl{font-size:9px;letter-spacing:2.5px;opacity:.55;text-transform:uppercase}
  #scorePanel .val{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-1px}
  #coinHud{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:14px;font-weight:800;color:#ffcc44}
  #coinHud .icon{width:14px;height:14px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#ffe68a,#ffbb22 60%,#cc8800);
    box-shadow:0 0 8px rgba(255,187,34,.6);display:inline-block}

  #comboPanel{position:absolute;top:118px;left:20px;padding:8px 14px;opacity:0;transition:opacity .2s,transform .15s;transform:translateX(-8px)}
  #comboPanel.on{opacity:1;transform:translateX(0)}
  #comboPanel .val{color:#ffbb44;font-weight:900;font-size:18px;letter-spacing:1px}
  #comboPanel .lbl{font-size:9px;letter-spacing:2px;opacity:.55}

  #healthPanel{position:absolute;top:20px;right:20px;width:210px;padding:12px 16px}
  #healthPanel .lbl{font-size:9px;letter-spacing:2.5px;opacity:.55;margin-bottom:6px}
  .hBar{height:8px;background:rgba(255,255,255,.1);border-radius:4px;overflow:hidden}
  .hBar i{display:block;height:100%;width:100%;
    background:linear-gradient(90deg,#ff4466,#ffbb44,#2ee6a8);
    transition:width .25s;box-shadow:0 0 12px rgba(46,230,168,.4)}

  #minimap{position:absolute;top:110px;right:20px;width:130px;height:170px;
    background:rgba(0,0,0,.55);border:1px solid rgba(255,255,255,.1);border-radius:12px;
    backdrop-filter:blur(10px)}

  #speedPanel{position:absolute;bottom:32px;right:32px;text-align:right}
  #speedVal{font-size:76px;font-weight:900;line-height:.85;letter-spacing:-4px;
    font-variant-numeric:tabular-nums;text-shadow:0 0 40px rgba(46,230,168,.55)}
  #speedVal small{font-size:.24em;font-weight:700;letter-spacing:3px;opacity:.6;margin-left:8px}
  #speedBar{margin-top:10px;height:6px;width:230px;background:rgba(255,255,255,.1);
    border-radius:3px;overflow:hidden;margin-left:auto}
  #speedBar i{display:block;height:100%;width:0;border-radius:3px;
    background:linear-gradient(90deg,#2ee6a8,#ffbb44 65%,#ff4466);transition:width .08s}
  #gearLine{margin-top:8px;font-size:11px;letter-spacing:4px;opacity:.65;font-weight:700}
  #gearLine b{color:#2ee6a8;font-size:18px;margin-left:6px;opacity:1}

  #nitroPanel{position:absolute;bottom:180px;right:32px;width:230px}
  #nitroPanel .lbl{font-size:10px;letter-spacing:3px;opacity:.6;margin-bottom:5px;text-align:right;font-weight:700}
  .nBar{height:10px;background:rgba(255,255,255,.1);border-radius:5px;overflow:hidden}
  .nBar i{display:block;height:100%;width:100%;border-radius:5px;
    background:linear-gradient(90deg,#3399ff,#66ddff);
    box-shadow:0 0 20px rgba(102,221,255,.6);transition:width .1s}

  #touch{position:fixed;inset:0;pointer-events:none;z-index:15;display:none}
  @media (hover:none) and (pointer:coarse){#touch{display:block}#keysHint{display:none}}
  .tBtn{position:absolute;pointer-events:auto;border:2px solid rgba(255,255,255,.25);
    background:rgba(255,255,255,.09);backdrop-filter:blur(10px);border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:11px;letter-spacing:1px;color:#fff;
    transition:transform .1s,background .1s;user-select:none}
  .tBtn.active{background:rgba(46,230,168,.4);border-color:#2ee6a8;transform:scale(.92)}
  .tBtn.left{left:20px;bottom:130px;width:76px;height:76px;font-size:22px}
  .tBtn.right{left:110px;bottom:130px;width:76px;height:76px;font-size:22px}
  .tBtn.brake{right:120px;bottom:130px;width:76px;height:76px;border-color:rgba(255,80,80,.45)}
  .tBtn.gas{right:22px;bottom:130px;width:88px;height:88px;border-color:rgba(46,230,168,.55)}
  .tBtn.nitro{right:70px;bottom:230px;width:66px;height:66px;border-color:rgba(102,221,255,.55);font-size:10px}

  #start,#pause,#gameover,#garage{position:fixed;inset:0;z-index:100;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 40%,#0a1a2a,#000 80%);
    transition:opacity .4s,visibility .4s;padding:20px}
  #start.hide,#pause.hide,#gameover.hide,#garage.hide{opacity:0;visibility:hidden;pointer-events:none}

  .card{width:min(92vw,460px);padding:30px 26px;text-align:center;
    background:rgba(18,22,36,.75);border:1px solid rgba(255,255,255,.1);
    border-radius:24px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    box-shadow:0 30px 90px rgba(0,0,0,.8);max-height:90vh;overflow-y:auto}

  .logo{font-size:40px;font-weight:900;letter-spacing:6px;line-height:1;
    margin-bottom:6px;background:linear-gradient(135deg,#2ee6a8,#66ddff,#aa88ff);
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .sub{font-size:10px;letter-spacing:4px;opacity:.5;margin-bottom:22px;font-weight:700}

  .stats{display:flex;justify-content:space-around;margin:18px 0;padding:14px 0;
    border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08)}
  .st{text-align:center;flex:1}
  .st .l{font-size:9px;letter-spacing:2px;opacity:.5;font-weight:700}
  .st .v{font-size:20px;font-weight:900;color:#2ee6a8;font-variant-numeric:tabular-nums;margin-top:2px}
  .st .v.gold{color:#ffcc44}

  .btn{display:block;width:100%;padding:15px;border:0;border-radius:14px;cursor:pointer;
    font-size:14px;font-weight:900;letter-spacing:3px;transition:transform .1s,box-shadow .2s;
    background:linear-gradient(135deg,#2ee6a8,#12b98a);color:#03211a;
    box-shadow:0 10px 30px rgba(46,230,168,.35)}
  .btn:hover{box-shadow:0 15px 45px rgba(46,230,168,.55)}
  .btn:active{transform:scale(.97)}
  .btn.sec{background:rgba(255,255,255,.1);color:#fff;box-shadow:none;margin-top:10px}
  .btn.gold{background:linear-gradient(135deg,#ffcc44,#ff9911);color:#2a1400;box-shadow:0 10px 30px rgba(255,187,34,.35)}

  .keys{margin:16px 0;font-size:12px}
  .keys div{display:flex;justify-content:space-between;padding:5px 0;opacity:.75}
  .keys b{background:rgba(255,255,255,.1);padding:3px 10px;border-radius:6px;
    font-size:10px;letter-spacing:1px;font-weight:800}

  /* GARAGE */
  #garage .card{width:min(96vw,560px);padding:24px 20px}
  .garageHeader{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .garageHeader .title{font-size:20px;font-weight:900;letter-spacing:2px}
  .coinPill{background:rgba(255,204,68,.15);border:1px solid rgba(255,204,68,.4);
    padding:6px 14px;border-radius:20px;font-size:13px;font-weight:800;color:#ffcc44;
    display:flex;align-items:center;gap:6px}
  .coinPill .icon{width:12px;height:12px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,#ffe68a,#ffbb22 60%,#cc8800)}
  .closeX{position:absolute;top:14px;right:16px;width:34px;height:34px;border-radius:50%;
    background:rgba(255,255,255,.1);border:0;color:#fff;font-size:18px;cursor:pointer;font-weight:700}

  .carPreview{position:relative;height:110px;margin:10px 0 18px;border-radius:16px;
    background:linear-gradient(180deg,rgba(46,230,168,.08),rgba(0,0,0,0));
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .carPreview canvas{width:100%;height:100%;object-fit:contain}

  .carInfo{text-align:center;margin-bottom:14px}
  .carInfo .name{font-size:22px;font-weight:900;letter-spacing:1px}
  .carInfo .desc{font-size:11px;opacity:.55;letter-spacing:1px;margin-top:3px}

  .statBars{display:flex;flex-direction:column;gap:8px;margin:14px 0}
  .statRow{display:flex;align-items:center;gap:10px;font-size:11px}
  .statRow .sl{width:70px;text-align:right;opacity:.6;letter-spacing:1px;font-weight:700}
  .statRow .sb{flex:1;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
  .statRow .sb i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#2ee6a8,#66ddff);transition:width .4s}
  .statRow .sv{width:38px;font-size:11px;font-weight:800;text-align:left;color:#66ddff}

  .carSelector{display:flex;gap:6px;overflow-x:auto;padding:8px 0 12px;scrollbar-width:none}
  .carSelector::-webkit-scrollbar{display:none}
  .carChip{flex-shrink:0;min-width:88px;padding:10px 8px;border-radius:12px;
    background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);
    cursor:pointer;transition:all .15s;position:relative}
  .carChip.active{background:rgba(46,230,168,.18);border-color:#2ee6a8}
  .carChip.locked{opacity:.6}
  .carChip .cname{font-size:10px;font-weight:800;letter-spacing:.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center}
  .carChip .cprice{font-size:9px;margin-top:4px;text-align:center;
    color:#ffcc44;font-weight:700}
  .carChip.owned .cprice{color:#2ee6a8}
  .carChip .lockIcon{position:absolute;top:4px;right:6px;font-size:10px;opacity:.7}
  .carChip .colorDot{width:10px;height:10px;border-radius:50%;margin:4px auto 0;
    border:1px solid rgba(255,255,255,.3)}

  .colorGrid{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin:10px 0}
  .colorSwatch{aspect-ratio:1;border-radius:8px;cursor:pointer;
    border:2px solid transparent;transition:transform .1s}
  .colorSwatch:hover{transform:scale(1.1)}
  .colorSwatch.selected{border-color:#fff;box-shadow:0 0 12px rgba(255,255,255,.6)}
  .colorSwatch.locked::after{content:'🔒';font-size:10px;display:flex;
    align-items:center;justify-content:center;width:100%;height:100%;background:rgba(0,0,0,.5);border-radius:6px}

  #soundBtn{position:fixed;top:22px;left:50%;transform:translateX(-50%);z-index:20;
    width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);
    background:rgba(0,0,0,.5);backdrop-filter:blur(10px);color:#fff;font-size:18px;
    cursor:pointer;display:none;align-items:center;justify-content:center}
  #soundBtn.on{display:flex}

  .cPop{position:fixed;top:44%;left:50%;transform:translate(-50%,-50%) scale(0);
    font-size:52px;font-weight:900;color:#ffbb44;
    text-shadow:0 0 50px rgba(255,187,68,.9);pointer-events:none;z-index:30;opacity:0}
  .cPop.show{animation:cPop .9s ease-out}
  @keyframes cPop{
    0%{transform:translate(-50%,-50%) scale(0);opacity:0}
    30%{transform:translate(-50%,-50%) scale(1.3);opacity:1}
    70%{transform:translate(-50%,-50%) scale(1);opacity:1}
    100%{transform:translate(-50%,-50%) scale(.9);opacity:0}
  }

  .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);
    padding:12px 22px;border-radius:12px;font-size:13px;font-weight:700;
    background:rgba(46,230,168,.95);color:#03211a;z-index:200;opacity:0;
    transition:all .3s;pointer-events:none;box-shadow:0 10px 30px rgba(46,230,168,.5)}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast.err{background:rgba(255,68,102,.95);color:#fff;box-shadow:0 10px 30px rgba(255,68,102,.5)}
  .toast.gold{background:rgba(255,204,68,.95);color:#2a1400;box-shadow:0 10px 30px rgba(255,187,34,.5)}
</style>
</head>
<body>

<canvas id="game"></canvas>
<div id="vignette"></div>
<div id="speedlines"></div>
<div id="nitrotint"></div>
<div id="flash"></div>

<div id="hud">
  <div id="scorePanel" class="glass">
    <div class="lbl">SKOR</div>
    <div class="val" id="scoreVal">0</div>
    <div id="coinHud"><span class="icon"></span><span id="coinVal">0</span></div>
  </div>
  <div id="comboPanel" class="glass">
    <div class="lbl">COMBO</div>
    <div class="val" id="comboVal">×1</div>
  </div>
  <div id="healthPanel" class="glass">
    <div class="lbl">KEROSAKAN</div>
    <div class="hBar"><i id="healthBar"></i></div>
  </div>
  <canvas id="minimap" width="130" height="170"></canvas>
  <div id="speedPanel">
    <div id="speedVal"><span id="speedNum">0</span><small>KM/H</small></div>
    <div id="speedBar"><i id="speedBarFill"></i></div>
    <div id="gearLine">GEAR <b id="gearNum">N</b></div>
  </div>
  <div id="nitroPanel">
    <div class="lbl">NITRO</div>
    <div class="nBar"><i id="nitroBar"></i></div>
  </div>
</div>

<div id="touch">
  <div class="tBtn left" data-k="left">◀</div>
  <div class="tBtn right" data-k="right">▶</div>
  <div class="tBtn brake" data-k="down">BREK</div>
  <div class="tBtn gas" data-k="up">GAS</div>
  <div class="tBtn nitro" data-k="nitro">NITRO</div>
</div>

<button id="soundBtn">🔊</button>
<div id="comboPopup" class="cPop"></div>
<div id="toast" class="toast"></div>

<!-- START -->
<div id="start">
  <div class="card">
    <div class="logo">DRIVE<span style="color:#2ee6a8">SIM</span></div>
    <div class="sub">LIVING WORLD</div>
    <div class="stats">
      <div class="st"><div class="l">REKOD</div><div class="v" id="highScore">0</div></div>
      <div class="st"><div class="l">COIN</div><div class="v gold" id="startCoins">0</div></div>
      <div class="st"><div class="l">KERETA</div><div class="v" id="carCount">1/6</div></div>
    </div>
    <div id="keysHint" class="keys">
      <div><span>Pecut</span><b>W / ↑</b></div>
      <div><span>Brek</span><b>S / ↓</b></div>
      <div><span>Stereng</span><b>A D / ← →</b></div>
      <div><span>Nitro</span><b>SHIFT</b></div>
    </div>
    <button class="btn" id="startBtn">MULA MEMANDU</button>
    <button class="btn gold" id="garageBtn" style="margin-top:10px">GARAGE & SHOP</button>
  </div>
</div>

<!-- GARAGE -->
<div id="garage" class="hide">
  <div class="card" style="position:relative">
    <button class="closeX" id="garageClose">✕</button>
    <div class="garageHeader">
      <div class="title">GARAGE</div>
      <div class="coinPill"><span class="icon"></span><span id="garageCoins">0</span></div>
    </div>

    <div class="carPreview"><canvas id="previewCanvas" width="440" height="200"></canvas></div>

    <div class="carInfo">
      <div class="name" id="carName">—</div>
      <div class="desc" id="carDesc">—</div>
    </div>

    <div class="statBars">
      <div class="statRow"><div class="sl">LAJU</div><div class="sb"><i id="statSpd"></i></div><div class="sv" id="statSpdN">0</div></div>
      <div class="statRow"><div class="sl">PECUT</div><div class="sb"><i id="statAcc"></i></div><div class="sv" id="statAccN">0</div></div>
      <div class="statRow"><div class="sl">HANDLING</div><div class="sb"><i id="statHnd"></i></div><div class="sv" id="statHndN">0</div></div>
    </div>

    <button class="btn" id="carActionBtn">PILIH</button>

    <div style="margin-top:16px">
      <div style="font-size:10px;letter-spacing:3px;opacity:.5;font-weight:800;text-align:left;margin-bottom:8px">WARNA</div>
      <div class="colorGrid" id="colorGrid"></div>
    </div>

    <div class="carSelector" id="carSelector"></div>
  </div>
</div>

<!-- PAUSE -->
<div id="pause" class="hide">
  <div class="card">
    <div class="logo" style="font-size:32px">PAUSE</div>
    <div class="sub">REHAT SEKEJAP</div>
    <button class="btn" id="resumeBtn">TERUSKAN</button>
    <button class="btn sec" id="restartBtn">MULA SEMULA</button>
    <button class="btn sec" id="pauseGarageBtn">GARAGE</button>
  </div>
</div>

<!-- GAME OVER -->
<div id="gameover" class="hide">
  <div class="card">
    <div class="logo" style="font-size:36px;background:linear-gradient(135deg,#ff4466,#ffbb44)">
      GAME OVER
    </div>
    <div class="sub">KERETA MUSNAH</div>
    <div class="stats">
      <div class="st"><div class="l">SKOR</div><div class="v" id="finalScore">0</div></div>
      <div class="st"><div class="l">JARAK</div><div class="v" id="finalDist">0m</div></div>
      <div class="st"><div class="l">COIN</div><div class="v gold" id="finalCoins">0</div></div>
    </div>
    <button class="btn" id="againBtn">CUBA LAGI</button>
    <button class="btn sec" id="goGarageBtn">GARAGE</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';

/* ============================================================
   PROFILE & CARS
   ============================================================ */
const CARS = [
  { id:'kancil',  name:'Kancil Turbo',   desc:'Kecil tapi berani',    price:0,     spd:75,  acc:18, hnd:1.00, base:0x2255aa },
  { id:'axia',    name:'Axia GT',        desc:'Harian yang pantas',   price:800,   spd:92,  acc:24, hnd:1.05, base:0xaa2222 },
  { id:'supra',   name:'Supra X',        desc:'Legenda JDM',          price:2500,  spd:115, acc:34, hnd:1.15, base:0xffaa22 },
  { id:'ferrari', name:'Ferrari Rosso',  desc:'Nafas Itali',          price:6000,  spd:140, acc:44, hnd:1.25, base:0xff2222 },
  { id:'lambo',   name:'Lamborghini SV', desc:'Lembu gila',           price:15000, spd:165, acc:55, hnd:1.35, base:0xffcc00 },
  { id:'bugatti', name:'Bugatti Chiron', desc:'Raja laju',            price:40000, spd:200, acc:72, hnd:1.45, base:0x2266ff }
];

const COLORS = [
  { hex:0x2255aa, price:0,   name:'Biru' },
  { hex:0xaa2222, price:0,   name:'Merah' },
  { hex:0x222228, price:0,   name:'Hitam' },
  { hex:0xdddddd, price:0,   name:'Putih' },
  { hex:0xffaa22, price:150, name:'Kuning' },
  { hex:0x22cc66, price:150, name:'Hijau' },
  { hex:0xff5522, price:300, name:'Oren' },
  { hex:0x9922cc, price:300, name:'Ungu' },
  { hex:0x00dddd, price:500, name:'Cyan' },
  { hex:0xff44aa, price:500, name:'Pink' },
  { hex:0xffcc00, price:800, name:'Emas' },
  { hex:0xcc88ff, price:800, name:'Lavender' },
  { hex:0xffffff, price:1200, name:'Diamond' },
  { hex:0x66ddff, price:1200, name:'Neon' },
  { hex:0xff0080, price:2000, name:'Hot Pink' },
  { hex:0x00ff88, price:2000, name:'Toxic Green' }
];

const defaultProfile = () => ({
  coins: 0,
  highScore: 0,
  currentCar: 'kancil',
  ownedCars: ['kancil'],
  ownedColors: [0x2255aa, 0xaa2222, 0x222228, 0xdddddd],
  carColors: {},   // { carId: hex }
  totalDistance: 0,
  totalRuns: 0
});

let profile = (() => {
  try {
    const raw = localStorage.getItem('drivesim_living_v1');
    if(raw){
      const p = JSON.parse(raw);
      return {...defaultProfile(), ...p};
    }
  } catch(e){}
  return defaultProfile();
})();

function saveProfile(){
  try { localStorage.setItem('drivesim_living_v1', JSON.stringify(profile)); } catch(e){}
}

function getCurrentCar(){
  return CARS.find(c => c.id === profile.currentCar) || CARS[0];
}
function getCarColor(carId){
  return profile.carColors[carId] ?? CARS.find(c => c.id === carId).base;
}

/* ============================================================
   RENDERER
   ============================================================ */
const canvas = document.getElementById('game');

const skyUniforms = {
  topColor:    {value: new THREE.Color(0x3a6ab0)},
  midColor:    {value: new THREE.Color(0x8ab4dc)},
  bottomColor: {value: new THREE.Color(0xffd7a8)},
  exponent:    {value: 0.55}
};
const skyMesh = new THREE.Mesh(
  new THREE.SphereGeometry(700, 32, 16),
  new THREE.ShaderMaterial({
    side: THREE.BackSide,
    uniforms: skyUniforms,
    vertexShader: `
      varying vec3 vWorld;
      void main(){
        vWorld = (modelMatrix * vec4(position,1.0)).xyz;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
      }`,
    fragmentShader: `
      uniform vec3 topColor; uniform vec3 midColor; uniform vec3 bottomColor;
      uniform float exponent; varying vec3 vWorld;
      void main(){
        float h = normalize(vWorld).y;
        vec3 col = h > 0.0
          ? mix(midColor, topColor, pow(h, exponent))
          : mix(midColor, bottomColor, pow(-h, exponent*0.6));
        gl_FragColor = vec4(col, 1.0);
      }`
  })
);
scene.add(skyMesh);

function drawDial(ctx, cx, cy, r, pct, label, valueStr, accent){
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2);
  ctx.fillStyle = '#0a0d14'; ctx.fill();
  ctx.strokeStyle = '#2a3038'; ctx.lineWidth = 3; ctx.stroke();
  const a0 = Math.PI*0.75, a1 = Math.PI*2.25;
  ctx.beginPath();
  ctx.arc(cx, cy, r-8, a0, a0 + (a1-a0)*Math.min(1,pct));
  ctx.strokeStyle = accent; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
  for(let i=0;i<=10;i++){
    const a = a0 + (a1-a0)*(i/10);
    const x1 = cx + Math.cos(a)*(r-16), y1 = cy + Math.sin(a)*(r-16);
    const x2 = cx + Math.cos(a)*(r-22), y2 = cy + Math.sin(a)*(r-22);
    ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2);
    ctx.strokeStyle = '#3a4048'; ctx.lineWidth = 2; ctx.stroke();
  }
  const na = a0 + (a1-a0)*Math.min(1,pct);
  ctx.beginPath();
  ctx.moveTo(cx - Math.cos(na)*10, cy - Math.sin(na)*10);
  ctx.lineTo(cx + Math.cos(na)*(r-14), cy + Math.sin(na)*(r-14));
  ctx.strokeStyle = '#ff4d4d'; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.stroke();
  ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI*2);
  ctx.fillStyle = '#666'; ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px system-ui';
  ctx.textAlign = 'center'; ctx.fillText(valueStr, cx, cy + r*0.55);
  ctx.fillStyle = '#888'; ctx.font = '10px system-ui';
  ctx.fillText(label, cx, cy + r*0.72);
  ctx.restore();
}
function drawGauge(kmh, gear, maxKmh){
  gctx.fillStyle = '#0a0d14'; gctx.fillRect(0,0,512,256);
  drawDial(gctx, 128, 128, 100, kmh/(maxKmh*1.15), 'KM/H', String(Math.round(kmh)), '#2ee6a8');
  drawDial(gctx, 384, 128, 100, (kmh%80)/80, 'RPM', String(Math.round((kmh%80)*95)), '#66ddff');
  gctx.fillStyle = '#2ee6a8'; gctx.font = 'bold 28px system-ui'; gctx.textAlign = 'center';
  gctx.fillText(gear, 256, 140);

/* ============================================================
   AUDIO
   ============================================================ */
let audio = null;
let muted = false;

function initAudio(){
  if(audio) return;
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  const ctx = new AC();
  const master = ctx.createGain(); master.gain.value = 0.55; master.connect(ctx.destination);

  const engineGain = ctx.createGain(); engineGain.gain.value = 0;
  engineGain.connect(master);
  const engineFilter = ctx.createBiquadFilter();
  engineFilter.type = 'lowpass'; engineFilter.frequency.value = 700; engineFilter.Q.value = 2.2;
  engineFilter.connect(engineGain);

  const o1 = ctx.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 60;
  o1.connect(engineFilter); o1.start();
  const o2 = ctx.createOscillator(); o2.type = 'square'; o2.frequency.value = 30;
  const o2g = ctx.createGain(); o2g.gain.value = 0.35;
  o2.connect(o2g); o2g.connect(engineFilter); o2.start();

  const noiseBuf = ctx.createBuffer(1, ctx.sampleRate*2, ctx.sampleRate);
  const nd = noiseBuf.getChannelData(0);
  for(let i=0;i<nd.length;i++) nd[i] = (Math.random()*2-1)*0.4;
  const wind = ctx.createBufferSource(); wind.buffer = noiseBuf; wind.loop = true;
  const windFilter = ctx.createBiquadFilter();
  windFilter.type = 'bandpass'; windFilter.frequency.value = 800; windFilter.Q.value = 0.7;
  const windGain = ctx.createGain(); windGain.gain.value = 0;
  wind.connect(windFilter); windFilter.connect(windGain); windGain.connect(master);
  wind.start();

  audio = {ctx, master, engineGain, engineFilter, o1, o2, windGain, windFilter};
  if(ctx.state === 'suspended') ctx.resume();
}

function updateEngineAudio(rpm, throttle, speed){
  if(!audio) return;
  const t = audio.ctx.currentTime;
  const f = 46 + rpm*180;
  audio.o1.frequency.setTargetAtTime(f, t, 0.05);
  audio.o2.frequency.setTargetAtTime(f*0.5, t, 0.05);
  audio.engineFilter.frequency.setTargetAtTime(400 + rpm*1400, t, 0.05);
  audio.engineGain.gain.setTargetAtTime(muted ? 0 : (0.025 + throttle*0.055), t, 0.06);
  audio.windGain.gain.setTargetAtTime(muted ? 0 : Math.min(0.06, speed*0.0008), t, 0.1);
  audio.windFilter.frequency.setTargetAtTime(600 + speed*15, t, 0.1);
}

function playCrashSound(){
  if(!audio || muted) return;
  const ctx = audio.ctx;
  const buf = ctx.createBuffer(1, ctx.sampleRate*0.35, ctx.sampleRate);
  const d = buf.getChannelData(0);
  for(let i=0;i<d.length;i++) d[i] = (Math.random()*2-1) * Math.pow(1-i/d.length, 2.5);
  const src = ctx.createBufferSource(); src.buffer = buf;
  const g = ctx.createGain(); g.gain.value = 0.5;
  const f = ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value = 220; f.Q.value = 0.6;
  src.connect(f); f.connect(g); g.connect(audio.master); src.start();
}

function playPickupSound(isNitro){
  if(!audio || muted) return;
  const ctx = audio.ctx;
  const o = ctx.createOscillator(); o.type = 'sine';
  o.frequency.setValueAtTime(isNitro ? 800 : 600, ctx.currentTime);
  o.frequency.exponentialRampToValueAtTime(isNitro ? 1600 : 1200, ctx.currentTime + 0.15);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.18, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.25);
  o.connect(g); g.connect(audio.master);
  o.start(); o.stop(ctx.currentTime + 0.3);
}

function playCoinSound(){
  if(!audio || muted) return;
  const ctx = audio.ctx;
  const o = ctx.createOscillator(); o.type = 'triangle';
  o.frequency.setValueAtTime(1200, ctx.currentTime);
  o.frequency.exponentialRampToValueAtTime(1800, ctx.currentTime + 0.08);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.12, ctx.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);
  o.connect(g); g.connect(audio.master);
  o.start(); o.stop(ctx.currentTime + 0.2);
}

  if(k === 'arrowup'    || k === 'w') keys.up = false;

/* ============================================================
   PLAYER UPDATE
   ============================================================ */
function updatePlayer(dt){
  let steerIn = 0;
  if(keys.left) steerIn -= 1;
  if(keys.right) steerIn += 1;
  player.steerTarget += (steerIn - player.steerTarget) * Math.min(1, dt*10);
  player.wheelAngle += (player.steerTarget*1.9 - player.wheelAngle) * Math.min(1, dt*13);

  const onRoad = Math.abs(player.x) < ROAD_W/2 - 1;
  const nitroWants = keys.nitro && player.nitro > 1;
  player.nitroActive = nitroWants && onRoad;

  const maxSpd = onRoad ? (player.nitroActive ? player.maxSpeed*1.3 : player.maxSpeed) : 26;

  let accel = 0;
  if(keys.up){
    accel = player.nitroActive ? player.accel*2.6 : player.accel;
    player.throttle = Math.min(1, player.throttle + dt*4);
  } else {
    player.throttle = Math.max(0, player.throttle - dt*3);
  }
  if(keys.down){
    accel -= player.accel*2.8;
    player.throttle = 0;
  }

  if(player.nitroActive) player.nitro = Math.max(0, player.nitro - 32*dt);
  else player.nitro = Math.min(100, player.nitro + 6*dt);

  player.speed += accel * dt;
  if(!keys.up && !keys.down) player.speed -= 5 * dt;
  if(!onRoad) player.speed -= 18 * dt;
  if(player.speed > maxSpd) player.speed -= 22 * dt;
  player.speed = Math.max(0, player.speed);

  const sf = Math.min(1, player.speed/12);
  player.heading -= player.steerTarget * 0.85 * player.handling * sf * dt;
  const move = player.speed * dt;
  player.x += -Math.sin(player.heading) * move;
  player.x = Math.max(-ROAD_W/2 - 22, Math.min(ROAD_W/2 + 22, player.x));

  player.distance += player.speed * dt;
  player.score += player.speed * dt * 2;

  /* Coins earned: distance + multiplier */
  const coinMult = 1 + (player.car.price / 5000);
  player.coinsEarned += player.speed * dt * 0.04 * coinMult;

  if(player.comboTimer > 0){
    player.comboTimer -= dt;
    if(player.comboTimer <= 0) player.combo = 0;
  }

  player.shake *= Math.pow(0.0008, dt);
  player.flash *= Math.pow(0.0008, dt);

  const shakeX = (Math.random()-0.5) * player.shake * 0.25;
  const shakeY = (Math.random()-0.5) * player.shake * 0.25;
  const bob = Math.sin(performance.now()*0.005) * Math.min(1, player.speed/40) * 0.008;
  camera.position.set(player.x + shakeX, 1.2 + bob + shakeY, 0);
  camera.rotation.set(-0.035 + (Math.random()-0.5)*player.shake*0.08,
                       player.heading,
                       -player.steerTarget*0.045 + (Math.random()-0.5)*player.shake*0.05);

  wheelSpin.rotation.z = -player.wheelAngle;
  headlight.intensity = dayTime < 0.24 || dayTime > 0.76 ? 4 : 0.8;
  return move;
}

/* ============================================================
   WORLD UPDATE
   ============================================================ */
function updateWorld(dt, move){
  for(const d of dashes){
    d.position.z += move;
    if(d.position.z > 30) d.position.z -= 700;
  }
  for(const t of trees){
    t.obj.position.z += move;
    if(t.obj.position.z > 40){
      t.obj.position.z -= WRAP;
      t.obj.position.x = t.side * (ROAD_W/2 + 3 + Math.random()*14);
      t.obj.scale.setScalar(0.85 + Math.random()*0.5);
      t.obj.rotation.y = Math.random()*Math.PI*2;
    }
  }
  for(const b of buildings){
    b.obj.position.z += move;
    if(b.obj.position.z > 50){
      b.obj.position.z -= WRAP*1.6;
      b.obj.position.x = b.side * (26 + Math.random()*30);
      b.obj.rotation.y = Math.random()*0.6;
    }
  }
  for(const l of lamps){
    l.obj.position.z += move;
    if(l.obj.position.z > 40){
      l.obj.position.z -= 520;
      l.obj.position.x = l.side * (ROAD_W/2 + 1.2);
    }
    const glow = dayTime < 0.24 || dayTime > 0.76 ? 1 : 0.15;
    l.bulb.material.opacity = 0.2 + glow*0.75;
  }
  for(const m of mtns){
    m.position.z += move * 0.02;
    if(m.position.z > -600) m.position.z -= 1400;
  }

  /* Clouds drift */
  for(const c of clouds){
    c.sprite.position.x += c.driftSpeed * dt;
    if(c.sprite.position.x > 300) c.sprite.position.x = -300;
  }

  /* Birds fly */
  for(const b of birds){
    b.position.x += b.userData.speed * dt;
    b.position.y = b.userData.baseY + Math.sin(performance.now()*0.002 + b.userData.phase) * 1.5;
    if(b.position.x > 100) b.position.x = -100;
    b.rotation.y = Math.PI/2;
  }
  birdGroup.position.z = -40;

  skyMesh.position.set(player.x, 0, 0);
}

/* ============================================================
   TRAFFIC UPDATE
   ============================================================ */
function updateTraffic(dt){
  for(const car of traffic){
    car.mesh.position.z += (player.speed - car.speed) * dt;

    if(car.mesh.position.z > 30){
      car.mesh.position.z = -420 - Math.random()*180;
      car.mesh.position.x = LANES[(Math.random()*3)|0];
      car.speed = 12 + Math.random()*18;
      car.hit = false;
    }

    if(!car.hit){
      const dx = Math.abs(car.mesh.position.x - player.x);
      const dz = Math.abs(car.mesh.position.z);
      if(dx < 2.0 && dz < 3.8){
        car.hit = true;
        onCollision();
        car.mesh.position.x += (car.mesh.position.x > player.x ? 2 : -2);
      }
    }

    if(!car.hit && car.mesh.position.z > 1.5 && car.mesh.position.z < 2.6){
      const dx = Math.abs(car.mesh.position.x - player.x);
      if(dx < 4.5){
        player.score += 150 + player.combo*25;
        player.coinsEarned += 8 + player.combo*3;
        player.combo++;
        player.comboTimer = 3;
        showComboPopup(player.combo);
      }
    }
  }
}

function onCollision(){
  playCrashSound();
  player.flash = 1;
  player.shake = 1.4;
  player.speed *= 0.45;
  player.health -= 14;
  player.combo = 0;
  player.comboTimer = 0;
  if(player.health <= 0){
    player.health = 0;
    gameOver();
  }
}

/* ============================================================
   PICKUP UPDATE
   ============================================================ */
function updatePickups(dt, move){
  for(let i = pickups.length - 1; i >= 0; i--){
    const p = pickups[i];
    p.mesh.position.z += move;
    p.mesh.rotation.y += dt * 2.5;
    p.mesh.rotation.x += dt * 1.5;
    p.mesh.position.y = 1.2 + Math.sin(performance.now()*0.003 + i)*0.15;

    const dx = Math.abs(p.mesh.position.x - player.x);
    const dz = Math.abs(p.mesh.position.z);
    if(dx < 2 && dz < 2.5){
      playPickupSound(p.isNitro);
      if(p.isNitro){
        player.nitro = Math.min(100, player.nitro + 40);
        player.score += 100;
        player.coinsEarned += 15;
      } else {
        player.score += 500;
        player.coinsEarned += 40;
        player.health = Math.min(100, player.health + 8);
      }
      scene.remove(p.mesh);
      pickups.splice(i, 1);
      spawnPickup();
      continue;
    }

    if(p.mesh.position.z > 30){
      scene.remove(p.mesh);
      pickups.splice(i, 1);
      spawnPickup();
    }
  }
}

/* ============================================================
   DAY/NIGHT
   ============================================================ */
const SKY_KEYS = [
  {t:0.00, top:0x05080f, mid:0x0a1a30, bot:0x1a2030},
  {t:0.22, top:0x1a2840, mid:0x4a5a7a, bot:0xd0906a},
  {t:0.32, top:0x4a7bb5, mid:0x8ab4dc, bot:0xffd7a8},
  {t:0.50, top:0x3a6ab0, mid:0x7aa8d8, bot:0xc8e4f4},
  {t:0.68, top:0x5a6aa0, mid:0xa08060, bot:0xff8850},
  {t:0.80, top:0x1a1830, mid:0x4a2840, bot:0x804030},
  {t:1.00, top:0x05080f, mid:0x0a1a30, bot:0x1a2030}
];
const _cA = new THREE.Color(), _cB = new THREE.Color();
function lerpHex(a, b, t, target){
  _cA.setHex(a); _cB.setHex(b);
  return target.copy(_cA.lerp(_cB, t));
}
function updateDayNight(dt){
  dayTime = (dayTime + dt/240) % 1;
  let k0 = SKY_KEYS[0], k1 = SKY_KEYS[1];
  for(let i=0;i<SKY_KEYS.length-1;i++){
    if(dayTime >= SKY_KEYS[i].t && dayTime <= SKY_KEYS[i+1].t){
      k0 = SKY_KEYS[i]; k1 = SKY_KEYS[i+1]; break;
    }
  }
  const f = (dayTime - k0.t) / (k1.t - k0.t || 1);
  lerpHex(k0.top, k1.top, f, skyUniforms.topColor.value);
  lerpHex(k0.mid, k1.mid, f, skyUniforms.midColor.value);
  lerpHex(k0.bot, k1.bot, f, skyUniforms.bottomColor.value);

  scene.fog = scene.fog || new THREE.Fog(0x8ab4dc, 100, 380);
  lerpHex(k0.mid, k1.mid, f, scene.fog.color);

  const sunAngle = dayTime * Math.PI * 2 - Math.PI/2;
  const sx = Math.cos(sunAngle) * 200;
  const sy = Math.sin(sunAngle) * 200;
  sun.position.set(sx + player.x, sy, 40);
  sunSprite.position.set(sx + player.x, sy, -50);
  sun.intensity = Math.max(0.05, Math.sin(sunAngle) * 2);
  hemi.intensity = 0.28 + Math.max(0, Math.sin(sunAngle)) * 1.1;

  starMat.opacity = Math.max(0, 1 - Math.abs(Math.sin(sunAngle))*2);
  stars.position.set(player.x, 0, 0);
  grassMat.color.setHex(0x4f7a3d).multiplyScalar(0.35 + Math.max(0, Math.sin(sunAngle))*0.9);

  if(Math.random() < dt/45){ rainOn = !rainOn; }
  rainIntensity += ((rainOn?1:0) - rainIntensity) * dt * 0.8;
  rainMat.opacity = rainIntensity * 0.7;

  if(rainIntensity > 0.2){
    const p = rainGeo.attributes.position.array;
    for(let i=0;i<rainCount;i++){
      p[i*3+1] -= (30 + player.speed*0.3) * dt;
      p[i*3+2] += player.speed * dt * 0.9;
      if(p[i*3+1] < -0.5 || p[i*3+2] > 20){
        p[i*3]   = (Math.random()-0.5)*70;
        p[i*3+1] = 25 + Math.random()*8;
        p[i*3+2] = -Math.random()*90;
      }
    }
    rainGeo.attributes.position.needsUpdate = true;
    rain.position.set(player.x, 0, 0);
  }
}

  mctx.fillStyle = 'rgba(60,60,70,0.7)'; mctx.fillRect(45, 0, 40, 170);
  mctx.strokeStyle = 'rgba(200,200,180,0.3)'; mctx.setLineDash([4,4]);
  mctx.beginPath(); mctx.moveTo(65, 0); mctx.lineTo(65, 170); mctx.stroke();
  mctx.setLineDash([]);
  for(const car of traffic){
    const relZ = car.mesh.position.z;
    if(relZ > 15 || relZ < -120) continue;
    const y = 150 - (relZ + 15) * (150/135);
    const x = 65 + (car.mesh.position.x - player.x) * 3.5;
    mctx.fillStyle = car.hit ? '#884444' : '#ff5555';
    mctx.fillRect(x-2, y-2, 4, 4);
  }
  for(const p of pickups){
    const relZ = p.mesh.position.z;
    if(relZ > 15 || relZ < -120) continue;
    const y = 150 - (relZ + 15) * (150/135);
    const x = 65 + (p.mesh.position.x - player.x) * 3.5;
    mctx.fillStyle = p.isNitro ? '#66ddff' : '#ffbb44';
    mctx.fillRect(x-1, y-1, 3, 3);
  }
  mctx.fillStyle = '#2ee6a8';
  mctx.beginPath(); mctx.moveTo(65, 155); mctx.lineTo(60, 163); mctx.lineTo(70, 163);
  mctx.closePath(); mctx.fill();
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
let last = performance.now();
function tick(){
  requestAnimationFrame(tick);
  const now = performance.now();
  let dt = (now - last) / 1000;
  last = now;
  if(dt > 0.05) dt = 0.05;

  if(state === 'playing'){
    updateDayNight(dt);
    const move = updatePlayer(dt);
    updateWorld(dt, move);
    updateTraffic(dt);
    updatePickups(dt, move);
    updateEngineAudio(
      Math.min(1, (player.speed / (player.maxSpeed*1.3)) * 0.7 + player.throttle * 0.35),
      player.throttle, player.speed
    );
  } else {
    wheelSpin.rotation.z = Math.sin(now*0.001) * 0.05;
    camera.position.set(0, 1.2, 0);
    camera.rotation.set(-0.02, 0, 0);
    /* clouds still drift on menu */
    for(const c of clouds){
      c.sprite.position.x += c.driftSpeed * dt;
      if(c.sprite.position.x > 300) c.sprite.position.x = -300;
    }
  }

  updateHUD();
  if(composer) composer.render();
  else renderer.render(scene, camera);
}

/* ============================================================
   RESIZE
   ============================================================ */
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  if(composer) composer.setSize(innerWidth, innerHeight);
});

/* ============================================================
   GARAGE UI
   ============================================================ */
let previewCar = null;

function buildGarage(){
  /* car selector */
  const sel = $('carSelector');
  sel.innerHTML = '';
  for(const c of CARS){
    const owned = profile.ownedCars.includes(c.id);
    const active = profile.currentCar === c.id;
    const chip = document.createElement('div');
    chip.className = 'carChip' + (active ? ' active' : '') + (owned ? ' owned' : ' locked');
    chip.innerHTML = `
      <div class="cname">${c.name}</div>
      <div class="cprice">${owned ? (active?'AKTIF':'PILIH') : '🪙 ' + c.price.toLocaleString()}</div>
      <div class="colorDot" style="background:#${getCarColor(c.id).toString(16).padStart(6,'0')}"></div>
    `;
    chip.addEventListener('click', () => {
      previewCar = c.id;
      renderGarageDetail();
    });
    sel.appendChild(chip);
  }

  /* color grid */
  const cg = $('colorGrid');
  cg.innerHTML = '';
  const carId = previewCar || profile.currentCar;
  const currentColor = getCarColor(carId);
  for(const col of COLORS){
    const owned = profile.ownedColors.includes(col.hex);
    const sw = document.createElement('div');
    sw.className = 'colorSwatch' + 
      (currentColor === col.hex ? ' selected' : '') + 
      (owned ? '' : ' locked');
    sw.style.background = '#' + col.hex.toString(16).padStart(6,'0');
    sw.title = col.name + (owned ? '' : ` (🪙 ${col.price})`);
    sw.addEventListener('click', () => {
      const cId = previewCar || profile.currentCar;
      if(!profile.ownedColors.includes(col.hex)){
        if(profile.coins >= col.price){
          profile.coins -= col.price;
          profile.ownedColors.push(col.hex);
          profile.carColors[cId] = col.hex;
          saveProfile();
          toast(`Warna ${col.name} dibeli!`, 'gold');
          playCoinSound();
        } else {
          toast(`Perlu ${col.price} coin`, 'err');
          return;
        }
      } else {
        profile.carColors[cId] = col.hex;
        saveProfile();
      }
      buildGarage();
      updateGarageHeader();
    });
    cg.appendChild(sw);
  }
}

function updateGarageHeader(){
  $('garageCoins').textContent = profile.coins.toLocaleString();
}

function renderGarageDetail(){
  const cid = previewCar || profile.currentCar;
  const car = CARS.find(c => c.id === cid);
  const owned = profile.ownedCars.includes(cid);
  const active = profile.currentCar === cid;

  $('carName').textContent = car.name;
  $('carDesc').textContent = car.desc;

  /* stat bars normalised to strongest */
  const maxSpd = CARS[CARS.length-1].spd;
  const maxAcc = CARS[CARS.length-1].acc;
  const maxHnd = CARS[CARS.length-1].hnd;

  $('statSpd').style.width = (car.spd/maxSpd*100) + '%';
  $('statAcc').style.width = (car.acc/maxAcc*100) + '%';
  $('statHnd').style.width = (car.hnd/maxHnd*100) + '%';
  $('statSpdN').textContent = car.spd;
  $('statAccN').textContent = car.acc;
  $('statHndN').textContent = car.hnd.toFixed(2);

  const btn = $('carActionBtn');
  btn.classList.remove('gold');
  if(active){
    btn.textContent = 'KERETA AKTIF';
    btn.disabled = true;
    btn.style.opacity = 0.5;
  } else if(owned){
    btn.textContent = 'PILIH KERETA INI';
    btn.disabled = false;
    btn.style.opacity = 1;
  } else {
    btn.textContent = `BELI — 🪙 ${car.price.toLocaleString()}`;
    btn.disabled = false;
    btn.classList.add('gold');
    btn.style.opacity = 1;
  }

  drawPreview(car);
}

function drawPreview(car){
  const pv = $('previewCanvas');
  const pctx = pv.getContext('2d');
  const w = pv.width, h = pv.height;
  pctx.clearRect(0,0,w,h);

  const col = getCarColor(car.id);
  const hex = '#' + col.toString(16).padStart(6,'0');

  /* ground glow */
  const grd = pctx.createRadialGradient(w/2, h*0.78, 10, w/2, h*0.78, w*0.45);
  grd.addColorStop(0, hex + '55');
  grd.addColorStop(1, 'transparent');
  pctx.fillStyle = grd;
  pctx.fillRect(0, 0, w, h);

  /* car body silhouette (side view) */
  pctx.save();
  pctx.translate(w/2, h*0.68);
  const scale = 1.0 + (car.spd - 75) / 200;
  pctx.scale(scale, scale);

  /* shadow */
  pctx.fillStyle = 'rgba(0,0,0,0.5)';
  pctx.beginPath();
  pctx.ellipse(0, 32, 130, 14, 0, 0, Math.PI*2);
  pctx.fill();

  /* body */
  pctx.fillStyle = hex;
  pctx.strokeStyle = 'rgba(0,0,0,0.4)';
  pctx.lineWidth = 2;
  pctx.beginPath();
  pctx.moveTo(-120, 0);
  pctx.lineTo(-105, -30);
  pctx.quadraticCurveTo(-90, -45, -60, -45);
  pctx.lineTo(-20, -45);
  pctx.quadraticCurveTo(-10, -58, 20, -60);
  pctx.lineTo(60, -60);
  pctx.quadraticCurveTo(85, -58, 95, -45);
  pctx.lineTo(115, -30);
  pctx.lineTo(125, 0);
  pctx.lineTo(125, 8);
  pctx.lineTo(-120, 8);
  pctx.closePath();
  pctx.fill();
  pctx.stroke();

  /* windows */
  pctx.fillStyle = 'rgba(20,30,45,0.85)';
  pctx.beginPath();
  pctx.moveTo(-50, -42);
  pctx.lineTo(-15, -42);
  pctx.lineTo(-15, -55);
  pctx.lineTo(15, -56);
  pctx.lineTo(15, -42);
  pctx.lineTo(70, -42);
  pctx.lineTo(85, -42);
  pctx.quadraticCurveTo(90, -50, 78, -52);
  pctx.lineTo(20, -52);
  pctx.quadraticCurveTo(-5, -50, -30, -38);
  pctx.lineTo(-50, -38);
  pctx.closePath();
  pctx.fill();

  /* headlight */
  pctx.fillStyle = 'rgba(255,240,200,0.9)';
  pctx.beginPath();
  pctx.ellipse(115, -12, 8, 5, 0, 0, Math.PI*2);
  pctx.fill();
  /* taillight */
  pctx.fillStyle = 'rgba(255,60,60,0.9)';
  pctx.beginPath();
  pctx.ellipse(-115, -8, 6, 4, 0, 0, Math.PI*2);
  pctx.fill();

  /* wheels */
  pctx.fillStyle = '#0a0a0c';
  for(const x of [-70, 70]){
    pctx.beginPath();
    pctx.arc(x, 12, 22, 0, Math.PI*2);
    pctx.fill();
    pctx.fillStyle = '#333';
    pctx.beginPath();
    pctx.arc(x, 12, 12, 0, Math.PI*2);
    pctx.fill();
    pctx.fillStyle = '#0a0a0c';
  }

  /* shine */
  const shine = pctx.createLinearGradient(-120, -60, 120, 10);
  shine.addColorStop(0, 'rgba(255,255,255,0)');
  shine.addColorStop(0.45, 'rgba(255,255,255,0.35)');
  shine.addColorStop(0.55, 'rgba(255,255,255,0.35)');
  shine.addColorStop(1, 'rgba(255,255,255,0)');
  pctx.fillStyle = shine;
  pctx.beginPath();
  pctx.moveTo(-120, -30);
  pctx.lineTo(-105, -30);
  pctx.lineTo(115, -5);
  pctx.lineTo(125, 0);
  pctx.lineTo(-120, 0);
  pctx.closePath();
  pctx.fill();

  pctx.restore();
}

$('carActionBtn').addEventListener('click', () => {
  const cid = previewCar || profile.currentCar;
  const car = CARS.find(c => c.id === cid);
  const owned = profile.ownedCars.includes(cid);

  if(profile.currentCar === cid) return;

  if(owned){
    profile.currentCar = cid;
    saveProfile();
    toast(`${car.name} dipilih!`);
    applyCarStats();
  } else {
    if(profile.coins >= car.price){
      profile.coins -= car.price;
      profile.ownedCars.push(cid);
      profile.currentCar = cid;
      if(!profile.carColors[cid]) profile.carColors[cid] = car.base;
      saveProfile();
      toast(`${car.name} dibeli! 🎉`, 'gold');
      playCoinSound();
      applyCarStats();
    } else {
      toast(`Coin tak cukup — perlu 🪙 ${car.price.toLocaleString()}`, 'err');
      return;
    }
  }
  buildGarage();
  renderGarageDetail();
  updateGarageHeader();
  updateStartScreen();
});

function openGarage(){
  previewCar = profile.currentCar;
  buildGarage();
  renderGarageDetail();
  updateGarageHeader();
  $('garage').classList.remove('hide');
  if(state === 'playing') pauseGame();
}
function closeGarage(){
  $('garage').classList.add('hide');
  updateStartScreen();
}

/* ============================================================
   UI BINDINGS
   ============================================================ */
$('startBtn').addEventListener('click', startGame);
$('resumeBtn').addEventListener('click', resumeGame);
$('restartBtn').addEventListener('click', startGame);
$('againBtn').addEventListener('click', startGame);
$('garageBtn').addEventListener('click', openGarage);
$('garageClose').addEventListener('click', closeGarage);
$('pauseGarageBtn').addEventListener('click', openGarage);
$('goGarageBtn').addEventListener('click', () => {
  $('gameover').classList.add('hide');
  $('start').classList.remove('hide');
  openGarage();
});

$('soundBtn').addEventListener('click', () => {
  muted = !muted;
  $('soundBtn').textContent = muted ? '🔇' : '🔊';
});

/* ============================================================
   BOOT
   ============================================================ */
applyCarStats();
spawnTraffic();
for(let i=0;i<6;i++){
  spawnPickup();
  pickups[pickups.length-1].mesh.position.z = -80 - i*70 - Math.random()*40;
}
drawGauge(0, 'N', 200);
updateStartScreen();
$('soundBtn').classList.add('on');
tick();
</script>
